<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d0a08">
<style>:root{color-scheme:dark}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Taas Adda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&family=Libre+Caslon+Text:wght@700&display=swap">
<style>
/* Layout: a dim card lounge. One tilted oval table fills the screen; seats, pot and controls float around it. Single dark look by choice. */
:root{
  --room:#0d0a08; --lamp:#3b2a1b; --ink:#f2e8d4; --muted:#b7a98f; --gold:#dcb565; --gold-deep:#8f6a2a;
  --panel:rgba(20,15,11,.92); --line:rgba(242,232,212,.14); --danger:#c94a3f; --win:#6fbf8a;
  --red:#c21f30; --black:#18181d; --blue:#1d58b8; --green:#16803d; --paper:#fbf8f0; --paper2:#efe7d6;
  --f1:#21704a; --f2:#0b3923; --wood1:#5a3018; --wood2:#2a140a;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ui:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --idx:'Libre Caslon Text',Georgia,serif;
  --t:.42s;
  color-scheme:dark;
}
:root[data-felt=royal]{--f1:#24578f;--f2:#0b2442}
:root[data-felt=maroon]{--f1:#7c2433;--f2:#340a13}
:root[data-felt=midnight]{--f1:#30394a;--f2:#0f131a}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;box-sizing:border-box;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 50% 28%,var(--lamp) 0%,#17110c 48%,var(--room) 100%);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden}

/* ---------- table ---------- */
#tablewrap{position:absolute;perspective:1100px;pointer-events:none}
#tablewrap::before{content:"";position:absolute;inset:14% 2% -6% 2%;border-radius:50%;background:rgba(0,0,0,.65);filter:blur(28px)}
#table{position:absolute;inset:0;border-radius:50%;transform:rotateX(34deg);transform-style:preserve-3d}
.rim{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d;
  background:repeating-radial-gradient(ellipse at 46% 40%,rgba(0,0,0,0) 0 7px,rgba(0,0,0,.09) 8px,rgba(0,0,0,0) 10px),
    radial-gradient(ellipse at 50% 22%,#9a6038 0%,var(--wood1) 42%,var(--wood2) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,220,170,.22),inset 0 -16px 30px rgba(0,0,0,.6),inset 0 12px 22px rgba(255,214,160,.22)}
.rim::before,.rim::after{content:"";position:absolute;inset:0;border-radius:50%}
.rim::before{background:linear-gradient(#3a1d0d,#1e0e05);transform:translateZ(-16px)}
.rim::after{background:#120803;transform:translateZ(-34px)}
.rail{position:absolute;inset:2.6%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 18%,#4a3426 0%,#24170f 45%,#120b07 100%);
  box-shadow:inset 0 3px 5px rgba(255,236,200,.18),inset 0 -8px 14px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.5)}
.rail::after{content:"";position:absolute;inset:3.2%;border-radius:50%;border:1px dashed rgba(230,196,140,.28)}
.trim{position:absolute;inset:5.7%;border-radius:50%;background:linear-gradient(170deg,#f2d690,#a77b33 45%,#6b4b1c 70%,#d9b468);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.felt{position:absolute;inset:6.2%;border-radius:50%;overflow:hidden;
  background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(255,236,190,.16),rgba(255,236,190,0) 70%),radial-gradient(ellipse at 50% 40%,var(--f1) 0%,var(--f2) 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.65),inset 0 6px 10px rgba(0,0,0,.7)}
.felt::before{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.55;mix-blend-mode:overlay}
.felt .ring{position:absolute;inset:17% 13%;border-radius:50%;border:2px solid rgba(220,181,101,.22)}
.felt .print{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(232,199,120,.2);font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:clamp(14px,3vw,30px);white-space:nowrap}
.felt .print small{display:block;font-family:var(--ui);font-size:.38em;letter-spacing:.5em;margin-top:.4em}

/* ---------- cards ---------- */
#cards,#seats,#fx,#labels{position:absolute;inset:0;pointer-events:none}
#labels{z-index:700}
#lamp{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 48% 40% at 50% 44%,rgba(255,214,150,.09),rgba(255,214,150,0) 70%),radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55));mix-blend-mode:normal}
.glabel{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;background:rgba(111,191,138,.92);color:#0d2416;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:1;transition:left .3s,top .3s}
.glabel.bad{background:rgba(242,232,212,.85);color:#3a2a1b}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);font-size:calc(var(--cw) / 5);perspective:calc(var(--cw) * 7);
  transition:transform var(--t) cubic-bezier(.22,.8,.24,1);pointer-events:auto}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--t) cubic-bezier(.3,.7,.2,1),translate .16s ease}
.face{position:absolute;inset:0;border-radius:.42em;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:radial-gradient(ellipse at 28% 18%,#fffef9 0%,var(--paper) 45%,var(--paper2) 100%);color:var(--black);
  box-shadow:0 .025em 0 #ddd3bf,0 .05em 0 #c4b9a2,0 .1em .14em rgba(0,0,0,.38),0 .55em 1.1em rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.1)}
.front::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--noise);background-size:110px;opacity:.07;mix-blend-mode:multiply}
.front .gl{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(90,70,40,.08) 100%)}
.card.wild .front::after{content:"★";position:absolute;right:.16em;top:.2em;width:.95em;height:.95em;border-radius:50%;display:grid;place-items:center;font-size:.62em;color:#3a2606;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c9982f);box-shadow:0 0 0 .05em #8a6420}
.back{transform:rotateY(180deg);box-shadow:0 .025em 0 #ddd3bf,0 .05em 0 #b8ad96,0 .1em .14em rgba(0,0,0,.4),0 .55em 1.1em rgba(0,0,0,.3)}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.22),rgba(255,255,255,0) 32%);pointer-events:none}
.s-H,.s-D{color:var(--red)}
#app.four .s-D{color:var(--blue)} #app.four .s-C{color:var(--green)}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.9;width:1.05em}
.idx b{font-family:var(--idx);font-size:.98em;letter-spacing:-.06em}
.idx i{font-style:normal;font-size:.8em;margin-top:.05em}
.idx.tl{left:.18em;top:.24em}
.idx.br{right:.18em;bottom:.24em;transform:rotate(180deg)}
.pips{position:absolute;inset:11% 17%}
.pips i{position:absolute;font-style:normal;font-size:1.06em;line-height:1;transform:translate(-50%,-50%)}
.pips i.dn{transform:translate(-50%,-50%) rotate(180deg)}
.ace{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:2.3em;line-height:1}
.ace.big{font-size:3.4em;filter:drop-shadow(0 0 0 #000)}
.ace.big::after{content:"";position:absolute;inset:-14%;border-radius:50%;border:.03em solid currentColor;opacity:.35}
.court{position:absolute;inset:15% 18%;border:.06em solid currentColor;border-radius:.12em;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.12em 0;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,currentColor 10%,transparent) 0 .12em,transparent .12em .3em),linear-gradient(180deg,#fff6dc,#f3e3b9);
  box-shadow:inset 0 0 0 .1em #fff8e6,inset 0 0 0 .14em color-mix(in srgb,currentColor 45%,transparent)}
.court .cl{font-family:var(--display);font-weight:700;font-size:2.05em;line-height:.8;text-shadow:0 .03em 0 rgba(0,0,0,.15)}
.court .cs{font-size:.72em;line-height:1;display:flex;align-items:center;gap:.08em}
.court svg{width:.85em;height:.6em;fill:currentColor}
.court .cs.dn{transform:rotate(180deg)}
/* backs */
.back{background:#8e1b2c}
.bk-crimson .back{background:
  radial-gradient(circle at 50% 50%,transparent 0 .9em,transparent .9em),
  repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 .08em,transparent .08em .42em),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 .08em,transparent .08em .42em),
  linear-gradient(160deg,#b02639,#6c1020);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #7a1424,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-navy .back{background:
  radial-gradient(circle at 50% 50%,rgba(220,181,101,.5) 0 .08em,transparent .1em) 0 0/.5em .5em,
  linear-gradient(160deg,#21386b,#0e1a36);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #1a2c55,inset 0 0 0 .5em rgba(220,181,101,.35),0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-jade .back{background:
  conic-gradient(from 45deg,rgba(255,255,255,.1) 25%,transparent 0 50%,rgba(255,255,255,.1) 0 75%,transparent 0) 0 0/.6em .6em,
  linear-gradient(160deg,#1f7a5a,#0b3d2c);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #0d4a35,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.card.play{cursor:pointer}
@media (hover:hover){.card.play:hover .inner{translate:0 -9%}}
.card.dim .front{filter:brightness(.62) saturate(.7)}
.card.glow .face{box-shadow:0 0 0 .1em var(--gold),0 0 1.2em .2em rgba(220,181,101,.65)}
.card.sel .front{box-shadow:0 0 0 .12em var(--gold),0 .6em 1.2em rgba(0,0,0,.4)}
.card.flat .face{box-shadow:none}
.card.static{position:relative;display:inline-block;transition:none}

/* ---------- seats ---------- */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(32,24,18,.94),rgba(16,12,9,.94));border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45);
  transition:left .3s,top .3s,box-shadow .3s,border-color .3s;z-index:1000;max-width:170px;white-space:nowrap}
.seat .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#1a120b;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--av) 60%,#fff),var(--av));box-shadow:inset 0 -2px 4px rgba(0,0,0,.3),0 0 0 2px #1a120b,0 0 0 3.5px rgba(220,181,101,.55)}
.seat .who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.seat .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.seat .sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seat .tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);padding:2px 7px;border-radius:999px;background:rgba(220,181,101,.12);font-variant-numeric:tabular-nums}
.seat .tag:empty{display:none}
.seat .dl{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:#f2e8d4;color:#1a120b;font-size:9.5px;font-weight:800;display:none;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.seat.dealer .dl{display:grid}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(220,181,101,.35),0 0 22px rgba(220,181,101,.35)}
.seat.turn .av{animation:pulse 1.1s ease-in-out infinite}
.seat.out{opacity:.55}
.seat.winner{border-color:var(--win);box-shadow:0 0 0 2px rgba(111,191,138,.4),0 0 24px rgba(111,191,138,.45)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(220,181,101,.35)}}
.bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px) scale(.9);opacity:0;background:var(--paper);color:#1a120b;font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:10px;white-space:nowrap;transition:opacity .2s,transform .2s;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--paper)}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.seat.low .bubble{bottom:auto;top:calc(100% + 8px)}
.seat.low .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--paper)}

/* ---------- center / chips ---------- */
#center{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:150;text-align:center}
.pot{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(calc(var(--ch) * .55))}
.pot b{font-size:18px;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.pot span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,232,212,.7)}
.stack{position:relative;height:30px;width:60px}
.chip{position:absolute;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18) 0 30%,var(--cc) 31% 52%,transparent 53%),repeating-conic-gradient(#f6eedc 0 14deg,var(--cc) 14deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 1px 0 color-mix(in srgb,var(--cc) 55%,#000),0 2px 0 #e9dfca,0 3px 0 color-mix(in srgb,var(--cc) 55%,#000),0 5px 6px rgba(0,0,0,.45)}
.stack .chip{transform:scaleY(.6)}
.stack{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:auto!important;height:46px!important}
.stack .col{position:relative;width:26px;height:46px}
.flychip{position:absolute;left:0;top:0;z-index:1200;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .2s .5s}
.trumpb{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(242,232,212,.8)}
.trumpb b{font-size:34px;line-height:1;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(251,248,240,.9);box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 0 0 3px rgba(220,181,101,.6)}
.trumpb.s-S b,.trumpb.s-C b{color:var(--black)}.trumpb.s-H b,.trumpb.s-D b{color:var(--red)}
.trumpb span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(242,232,212,.7)}
.feltnote{position:absolute;white-space:nowrap;transform:translate(-50%,-50%);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,232,212,.55);font-weight:600}

/* ---------- HUD ---------- */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 0;z-index:2950;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(20,15,11,.75);display:grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{border-color:rgba(220,181,101,.5)}
.ib:focus-visible,.btn:focus-visible,.tile:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ttl{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.ttl b{font-family:var(--display);font-size:22px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
#msg{position:absolute;left:50%;bottom:calc(var(--actb) + 10px);transform:translateX(-50%);z-index:1400;background:rgba(14,10,8,.82);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
#msg:empty{opacity:0}
#actions{position:absolute;left:50%;bottom:var(--actb);transform:translateX(-50%);z-index:1300;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:calc(100% - 8px)}
#actions.center{top:50%;bottom:auto;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);padding:14px 16px 16px;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.atitle{font-family:var(--display);font-size:20px;font-weight:700}
.ahint{font-size:12px;color:var(--muted);margin-top:-4px}
.arow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn{border:1px solid var(--line);background:rgba(28,21,16,.94);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.15;box-shadow:0 6px 16px rgba(0,0,0,.4);min-width:72px}
.btn small{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.btn:hover:not(:disabled){border-color:rgba(220,181,101,.55)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:linear-gradient(180deg,#e9c779,#b48a3c);color:#1d140a;border-color:#f1d896}
.btn.primary small{color:#3d2b12}
.btn.danger{color:#f1b0a8}
.btn.bid{min-width:44px;padding:10px 0;font-size:17px;font-variant-numeric:tabular-nums}
.btn.bid.sug{border-color:var(--gold);color:var(--gold)}

/* ---------- lobby & modals ---------- */
#lobby{position:absolute;inset:0;z-index:2000;overflow:auto;background:linear-gradient(180deg,rgba(13,10,8,.55),rgba(13,10,8,.92) 55%);display:flex;flex-direction:column;align-items:center;padding-block:36px 28px;gap:26px}
.brand{text-align:center}
.brand .suits{font-size:18px;letter-spacing:.5em;color:var(--gold);margin-left:.5em}
.brand h1{font-family:var(--display);font-weight:700;font-size:clamp(46px,9vw,84px);margin:2px 0 0;line-height:.95;letter-spacing:.01em;text-wrap:balance;
  background:linear-gradient(180deg,#f7e2a6 10%,#c99a46 60%,#8f6a2a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:8px 0 0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:min(1000px,100%)}
.tile{position:relative;text-align:left;border:1px solid var(--line);border-radius:18px;padding:0;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,rgba(40,30,22,.9),rgba(18,13,10,.95));box-shadow:0 14px 34px rgba(0,0,0,.45);transition:transform .2s,border-color .2s;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-3px);border-color:rgba(220,181,101,.5)}
.tile .fan{height:118px;position:relative;background:radial-gradient(ellipse at 50% 120%,var(--f1),var(--f2));overflow:hidden}
.tile .fan .card{position:absolute;left:50%;top:22px;--cw:52px;--ch:73px}
.tile .tb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.tile h2{margin:0;font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.tile .meta{font-size:12px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.tile p{margin:2px 0 0;color:var(--muted);font-size:13.5px;line-height:1.45}
.tile .st{margin-top:auto;padding-top:10px;font-size:12px;color:rgba(242,232,212,.6);font-variant-numeric:tabular-nums}
.lobfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--muted);font-size:13px}
#modal{position:absolute;inset:0;z-index:3000;display:grid;place-items:center;background:rgba(5,4,3,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px 0}

<script>
'use strict';
/* ================= utilities ================= */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hash(s){let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return h}
const jit=(id,amp)=>((Math.abs(hash(id))%1000)/1000-.5)*amp;
class Abort extends Error{}
let TOKEN=0;

/* ================= settings & stats ================= */
const DEF={name:'You',felt:'emerald',back:'crimson',four:false,speed:'normal',diff:'normal',sound:true};
let S=Object.assign({},DEF);
try{const s=JSON.parse(localStorage.getItem('taas.settings')||'null');if(s)Object.assign(S,s)}catch(e){}
const saveS=()=>{try{localStorage.setItem('taas.settings',JSON.stringify(S))}catch(e){}};
let STATS={};try{STATS=JSON.parse(localStorage.getItem('taas.stats')||'{}')||{}}catch(e){}
function stat(k,won){const s=STATS[k]||(STATS[k]={p:0,w:0});s.p++;if(won)s.w++;try{localStorage.setItem('taas.stats',JSON.stringify(STATS))}catch(e){}}
const SPEED={slow:1.5,normal:1,fast:.55};
const spd=()=>SPEED[S.speed]||1;
function sleep(ms){const t=TOKEN;return new Promise((res,rej)=>setTimeout(()=>t===TOKEN?res():rej(new Abort()),ms*spd()))}

/* ================= sound (synthesised) ================= */
let AC=null,NOISE=null;
function ac(){if(!S.sound)return null;try{if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b}if(AC.state==='suspended')AC.resume()}catch(e){return null}return AC}
function tone(a,f,t0,dur,type,vol){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.02)}
function sfx(k){const a=ac();if(!a)return;const t=a.currentTime;
  if(k==='card'||k==='sweep'){const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NOISE;f.type='bandpass';f.frequency.value=k==='card'?2600:1400;f.Q.value=.9;const d=k==='card'?.07:.22;g.gain.setValueAtTime(k==='card'?.32:.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02)}
  else if(k==='chip'){tone(a,2900,t,.07,'sine',.12);tone(a,3600,t+.03,.08,'sine',.08)}
  else if(k==='tick'){tone(a,880,t,.06,'triangle',.12)}
  else if(k==='fold'){tone(a,220,t,.14,'triangle',.12)}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(a,f,t+i*.09,.35,'triangle',.13))}
  else if(k==='lose'){[392,330,262].forEach((f,i)=>tone(a,f,t+i*.12,.3,'triangle',.11))}
}

/* ================= cards ================= */
const SUITS=['S','H','C','D'];
const SYM={S:'♠︎',H:'♥︎',D:'♦︎',C:'♣︎'};
const rl=r=>r<=10?String(r):({11:'J',12:'Q',13:'K',14:'A'})[r];
const RNAME={2:'Two',3:'Three',4:'Four',5:'Five',6:'Six',7:'Seven',8:'Eight',9:'Nine',10:'Ten',11:'Jack',12:'Queen',13:'King',14:'Ace'};
function newDeck(){const d=[];for(const s of SUITS)for(let r=2;r<=14;r++)d.push({r,s,id:rl(r)+s});return d}
const PIPS={2:[[50,8],[50,92]],3:[[50,8],[50,50],[50,92]],4:[[22,8],[78,8],[22,92],[78,92]],5:[[22,8],[78,8],[50,50],[22,92],[78,92]],
 6:[[22,8],[78,8],[22,50],[78,50],[22,92],[78,92]],7:[[22,8],[78,8],[50,29],[22,50],[78,50],[22,92],[78,92]],
 8:[[22,8],[78,8],[50,29],[22,50],[78,50],[50,71],[22,92],[78,92]],9:[[22,8],[78,8],[22,36],[78,36],[50,50],[22,64],[78,64],[22,92],[78,92]],
 10:[[22,8],[78,8],[50,22],[22,36],[78,36],[22,64],[78,64],[50,78],[22,92],[78,92]]};
const COURT={13:'<svg viewBox="0 0 24 16"><path d="M2 15h20l-1.6-10.5-5.2 4.8L12 1.5 8.8 9.3 3.6 4.5z"/></svg>',12:'<svg viewBox="0 0 24 16"><path d="M3 15h18l-1.2-8-4.3 3.6L12 4l-3.5 6.6L4.2 7z"/><circle cx="12" cy="2.4" r="1.8"/><circle cx="3.6" cy="5" r="1.4"/><circle cx="20.4" cy="5" r="1.4"/></svg>',11:'<svg viewBox="0 0 24 16"><path d="M3 15.5C7 12 11 6 21 .5 17.5 5.5 13 10.5 6.5 15.5z"/><path d="M3 15.5l7-6" stroke="currentColor" fill="none" stroke-width="1"/></svg>'};
function faceHTML(c){
  const y=SYM[c.s],R=rl(c.r);let mid;
  if(c.r<=10)mid='<div class="pips">'+PIPS[c.r].map(([x,yy])=>`<i style="left:${x}%;top:${yy}%"${yy>50?' class="dn"':''}>${y}</i>`).join('')+'</div>';
  else if(c.r===14)mid=`<div class="ace${c.s==='S'?' big':''}">${y}</div>`;
  else{const ic=COURT[c.r];mid=`<div class="court"><span class="cs">${ic}${y}</span><span class="cl">${R}</span><span class="cs dn">${ic}${y}</span></div>`}
  return `<div class="face front s-${c.s}"><div class="gl"></div><div class="idx tl"><b>${R}</b><i>${y}</i></div>${mid}<div class="idx br"><b>${R}</b><i>${y}</i></div></div><div class="face back"></div>`;
}
const cardsLayer=$('#cards'),seatsLayer=$('#seats'),app=$('#app');
const CARDS=new Map();
function cardEl(c){let el=CARDS.get(c.id);if(el)return el;el=document.createElement('div');el.className='card';el.dataset.id=c.id;el.hidden=true;el.innerHTML=`<div class="inner">${faceHTML(c)}</div>`;cardsLayer.appendChild(el);CARDS.set(c.id,el);return el}
function hideAll(){for(const el of CARDS.values())el.hidden=true}

/* ================= geometry ================= */
let W=0,H=0,CW=60,CH=84,cx=0,cy=0,rx=0,ry=0,PORTRAIT=false;
function geo(){
  W=app.clientWidth;H=app.clientHeight;PORTRAIT=H>W*1.1;
  CW=Math.round(clamp(Math.min(W/(PORTRAIT?6.8:10.5),H/(PORTRAIT?8.4:5.9)),40,96));CH=Math.round(CW*1.4);
  cx=W/2;cy=H*(PORTRAIT?.44:.45);rx=W*(PORTRAIT?.37:.4);ry=H*(PORTRAIT?.27:.31);
  app.style.setProperty('--cw',CW+'px');app.style.setProperty('--ch',CH+'px');app.style.setProperty('--actb',(CH*1.12+(W<560?70:12)+((G&&G.actbExtra)||0))+'px');
  const tw=$('#tablewrap'),w=rx*2.18,h=ry*2.5;
  Object.assign(tw.style,{width:w+'px',height:h+'px',left:(cx-w/2)+'px',top:(cy-h/2+ry*.08)+'px'});
}
const seatAng=(i,n)=>(90-i*360/n)*Math.PI/180; // play passes to the right (anticlockwise), as in Nepal and India
const seatPt=(i,n)=>{const a=seatAng(i,n);return{x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}};
const handY=()=>H-CH*.56-4;
const lerp=(p,q,k)=>({x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k});
function humanFan(cards,L,o={}){
  const n=cards.length;if(!n)return 0;const s=o.s||1;
  const maxW=Math.min(W-12,n*CW*s*.7+CW*s*.3);
  const sp=n>1?Math.min(CW*s*.7,(maxW-CW*s)/(n-1)):0;const y0=handY()-(s-1)*CH*.5;
  cards.forEach((c,k)=>{const off=k-(n-1)/2;let y=y0+off*off*CW*.011;if(o.sel&&o.sel.has(c.id))y-=CH*.22;
    const legal=o.legal?o.legal.has(c.id):!!o.click;
    L.push({c,x:cx+off*sp,y,r:off*(n>6?1.4:3),t:0,up:o.up!==false,s,z:600+k,click:legal,dim:(o.legal&&!legal)||o.dim,sel:o.sel&&o.sel.has(c.id)})});
  return sp*(n-1)+CW*s;
}
function oppFan(i,n,cards,L,o={}){
  const a=seatAng(i,n),sp=seatPt(i,n),k=o.k??(PORTRAIT?.34:.3);
  const b=lerp(sp,{x:cx,y:cy},k);const tx=-Math.sin(a),ty=Math.cos(a);const s=o.s??.5,gap=o.gap??CW*.13,m=cards.length;
  cards.forEach((c,j)=>{const off=j-(m-1)/2;L.push({c,x:b.x+tx*off*gap,y:b.y+ty*off*gap,r:a*180/Math.PI-90+off*(o.up?2:3),t:o.t??22,up:!!o.up,s,z:(o.z??200)+j,dim:o.dim,glow:o.glow,click:o.click})});
}
function badgePos(i){
  const n=G.players.length;
  if(i===0){const span=G.handSpan||CW*3;const left=cx-span/2;
    if(left>(W<560?150:200))return{x:left-(W<560?72:96),y:handY()+CH*.05,low:false};
    return{x:W<560?70:96,y:handY()-CH*.62-(W<560?30:24)-(G.actbExtra||0),low:false}}
  const a=seatAng(i,n),sp=seatPt(i,n);let x=sp.x+(sp.x-cx)*.1,y=sp.y+(sp.y-cy)*.14;

   ========================================================= */
function tpKey(h){
  const r=h.map(c=>c.r).sort((a,b)=>b-a),fl=h[0].s===h[1].s&&h[1].s===h[2].s;let seq=0;
  if(r[0]-r[1]===1&&r[1]-r[2]===1)seq=r[0]*2;else if(r[0]===14&&r[1]===3&&r[2]===2)seq=27;
  let cat,v;
  if(r[0]===r[2]){cat=6;v=[r[0]*2,0,0]}
  else if(seq&&fl){cat=5;v=[seq,0,0]}
  else if(seq){cat=4;v=[seq,0,0]}
  else if(fl){cat=3;v=r.map(x=>x*2)}
  else if(r[0]===r[1]||r[1]===r[2]){cat=2;const pr=r[1],k=r[0]===r[1]?r[2]:r[0];v=[pr*2,k*2,0]}
  else{cat=1;v=r.map(x=>x*2)}
  return cat*32768+v[0]*1024+v[1]*32+v[2]}

  let b=0;for(const s of SUITS)for(let r=2;r<=14;r++){const k=tpKey([...fx,{r,s}]);if(k>b)b=k}return b}
let TPK=null;

    this.variant=o.variant||'classic';this.n=o.players||4;this.boot=o.boot||10;this.start=o.chips||1000;this.maxStake=this.boot*64;this.potLimit=this.boot*400;
    this.deck=newDeck();this.players=makePlayers(this.n).map(p=>Object.assign(p,{chips:this.start,hand:[],seen:false,packed:false,tag:''}));

  print(){return[this.title.toUpperCase(),this.variant==='joker'?'JOKER WILD':this.variant==='muflis'?'MUFLIS · LOWEST WINS':`BOOT ${this.boot} · POT LIMIT ${fmt(this.potLimit)}`]}
  subtitle(){return`Hand ${this.handNo} · Boot ${this.boot} · ${this.variant==='classic'?'Classic':this.variant==='joker'?'Joker':'Muflis'}`}
  deckPos(){return{x:cx+CW*1.5,y:cy-CH*.1}}
  key3(p){return this.variant==='joker'&&this.joker?jokerKey(p.hand,this.joker.r):tpKey(p.hand)}
  cmp(i,j){const a=this.key3(this.players[i]),b=this.key3(this.players[j]);return this.variant==='muflis'?b-a:a-b}

/* =========================================================
   DHUMBAL

class Dhumbal{
  constructor(o){this.key='dhumbal';this.title='Dhumbal';this.n=o.players||4;this.limit=o.show||7;this.endAt=o.end||100;this.deck=newDeck();

  centerHTML(){return`<div class="feltnote" style="left:${-CW*1.25}px;top:${CH*.68}px">Deck ${this.pile.length}</div><div class="feltnote" style="left:${CW*.85}px;top:${CH*.68}px">Last discard</div>`}
  placements(){const L=[],dp=this.deckPos(),pick=this.phase==='pick';
    this.pile.forEach((c,k)=>L.push({c,x:dp.x+k*.15,y:dp.y-k*.3,t:24,up:false,z:k+1,s:.86,click:pick,glow:pick&&k===this.pile.length-1,flat:k>0&&k<this.pile.length-1}));

      this.pending.forEach((c,k)=>L.push({c,x:q.x+(k-(g-1)/2)*CW*.4,y:q.y,r:jit(c.id,10),t:22,up:true,s:.76,z:160+k}))}

      setActions([{label:'Show',sub:`hand ${t}`,value:'show',disabled:t>this.limit},{label:sel.length>1?`Discard ${sel.length}`:'Discard',value:'discard',disabled:!ok,kind:'primary'}]);
      msg(!sel.length?'Select a card, a set of one rank, or a run of 3+ in one suit':ok?(t<=this.limit?`Discard, or Show with ${t}`:'Discard the selection'):'Not a valid set');render();
      const v=await waitHuman();

    else if(this.phase==='pick'){if(this.pile.some(c=>c.id===id))resolveHuman('deck');else if(this.prev.some(c=>c.id===id))resolveHuman({card:id})}}

  get cards(){return this.seq[this.ri]}

  deckPos(){return{x:cx,y:cy}}

  for(const s of SUITS){const byV=new Map();cards.forEach((c,i)=>{if(c.s!==s)return;(c.r===14?[1,14]:[c.r]).forEach(v=>{if(!byV.has(v))byV.set(v,i)})});
    if(!byV.size)continue;
    for(let lo=1;lo<=12;lo++)for(let hi=lo+2;hi<=Math.min(14,lo+12);hi++){
      if(!(byV.has(lo)&&byV.has(hi))&&hi-lo>2)continue;
      const idx=[];for(let v=lo;v<=hi;v++)if(byV.has(v))idx.push(byV.get(v));
      const need=hi-lo+1-idx.length;if(!idx.length||need>totalW)continue;
      cand.push({idx,need,seq:true,pure:need===0})}}
  for(let r=2;r<=14;r++){const bs={};cards.forEach((c,i)=>{if(c.r===r)bs[c.s]=i});const ks=Object.values(bs),m=ks.length;if(!m)continue;
    for(let mk=1;mk<(1<<m);mk++){const sub=ks.filter((_,j)=>mk>>j&1);for(const size of [3,4]){const need=size-sub.length;if(need<0||need>totalW)continue;cand.push({idx:sub,need,seq:false,pure:false})}}}
  const byCard=cards.map(()=>[]);cand.forEach((m,ci)=>m.idx.forEach(i=>byCard[i].push(ci)));
  const order=cards.map((c,i)=>i).sort((a,b)=>(isW(cards[a])-isW(cards[b]))||(byCard[a].length-byCard[b].length));
  const P=cards.map(c=>rPts(c,w)),all=P.reduce((a,b)=>a+b,0);
  let best={score:all+1,cov:-1,melds:[],used:0},nodes=0;const melds=[];
  const rec=(k,used,skip,need)=>{if(++nodes>40000||best.score===0)return;
    while(k<n&&((used|skip)>>order[k]&1))k++;
    if(k===n){let freeW=0,dead=0,cov=0;for(let i=0;i<n;i++){if(used>>i&1)cov++;else{dead+=P[i];if(isW(cards[i]))freeW++}}if(need>freeW)return;
      let pure=0,seqs=0,np=0;for(const m of melds){if(m.seq){seqs++;if(m.pure){pure++;continue}}for(const i of m.idx)np+=P[i]}
      const score=pure>=1&&seqs>=2?dead:pure>=1?dead+np:all;
      if(score<best.score||(score===best.score&&cov>best.cov))best={score,cov,melds:melds.slice(),used};return}
    const i=order[k];
    for(const ci of byCard[i]){const m=cand[ci];if(need+m.need>totalW)continue;let ok=true,mask=used;for(const x of m.idx){if((used|skip)>>x&1){ok=false;break}mask|=1<<x}if(!ok)continue;
      melds.push(m);rec(k+1,mask,skip,need+m.need);melds.pop();if(best.score===0)return}
    rec(k+1,used,skip|(1<<i),need)};
  rec(0,0,0,0);
  const free=[];for(let i=0;i<n;i++)if(!(best.used>>i&1)&&isW(cards[i]))free.push(cards[i]);
  const groups=best.melds.map(m=>{const cs=m.idx.map(i=>cards[i]);if(m.seq){const hiA=cs.some(c=>c.r===13);cs.sort((a,b)=>(a.r===14&&!hiA?1:a.r)-(b.r===14&&!hiA?1:b.r))}
    for(let k=0;k<m.need;k++)cs.push(free.shift());return{cards:cs,type:m.seq?(m.pure?'pure':'seq'):'set'}});
  const order2={pure:0,seq:1,set:2};groups.sort((a,b)=>order2[a.type]-order2[b.type]);
  const usedSet=new Set(groups.flatMap(g=>g.cards));
  if(best.score===0&&free.length){const g=groups.find(g=>g.type!=='set')||groups[0];if(g){g.cards.push(...free);free.forEach(c=>usedSet.add(c))}}
  const loose=cards.filter(c=>!usedSet.has(c));
  return{score:best.score,groups,loose}}

    this.pile=[];this.open=[];this.cut=null;this.wildR=null;this.dealNo=0;this.cur=-1;this.phase='';this.sel=null;this.reveal=false;this.cache=new Map();this.labels=[];this.winIdx=-1}

  placements(){const L=[],dp=this.deckPos(),op=this.openPos(),dr=this.phase==='draw',w=this.wildR;this.labels=[];

const RULES={
 callbreak:`<h4>Setup</h4><p>Four players, one 52-card deck, 13 cards each. Dealing and play pass to the right (anticlockwise). The player to the dealer’s right bids first and leads the first trick. Spades are always trump.</p>
 <h4>Bidding</h4><p>Each player bids how many tricks they expect to win, at least 1. This table allows bids from 1 to 8.</p>
 <h4>Playing a trick</h4><ul><li>You must follow the suit that was led, and you must play higher than the best card of that suit in the trick if you can.</li><li>If you have none of the led suit, you must play a spade. If a spade is already in the trick, you must beat it if you can; if you can’t, you may play any card.</li><li>If you have neither the led suit nor spades, play any card.</li><li>The highest spade wins the trick; if no spade was played, the highest card of the led suit wins. The winner leads next.</li></ul>
 <h4>Scoring</h4><p>Make your bid: score the bid, plus 0.1 for each extra trick (bid 3, win 5 = 3.2). Miss it: score minus your bid (−3). After the last round, the highest total wins.</p>`,

 <h4>Betting</h4><ul><li>Everyone puts the boot in the pot and gets three cards face down. Play passes to the right.</li><li>A <b>blind</b> player bets the current stake without looking. A <b>seen</b> player bets twice the stake (Chaal).</li><li><b>Raise</b> doubles the stake. <b>Pack</b> folds your hand.</li><li><b>Sideshow</b>: if you and the player before you have both seen your cards, you can ask to compare privately. They may refuse. If they accept, the weaker hand packs; on a tie the asker packs.</li><li><b>Show</b> is only possible when two players remain. A seen player cannot ask a blind player for a show. On a tie, the player who asked loses.</li><li>When the pot reaches the pot limit, all remaining hands are shown and the best one wins.</li></ul>
 <h4>Variants</h4><p><b>Joker wild</b>: one card is turned up; every card of that rank is wild. <b>Muflis</b>: the order is reversed and the lowest hand wins.</p>`,
 dhumbal:`<h4>Card values</h4><p>A = 1, 2 to 10 at face value, J = 11, Q = 12, K = 13. You want the lowest total.</p>
 <h4>Your turn</h4><ul><li>Each player has 5 cards. Play passes to the right.</li><li>First <b>discard</b>: one card, or 2 to 4 cards of the same rank, or a run of 3 or more in one suit (A-2-3 counts; Q-K-A does not).</li><li>Then <b>pick up one card</b>: the top of the deck, or any one card the previous player just discarded.</li></ul>
 <h4>Show</h4><p>At the start of your turn, if your hand totals the show limit or less, you can call Show instead of discarding.</p><ul><li>If your total is strictly the lowest, you score 0 and everyone else adds their hand total.</li><li>If anyone ties or beats you, you add your total plus a 25-point penalty, the lowest hand scores 0, and the rest add their totals.</li></ul>
 <p>When someone reaches the end score, the lowest score wins. Dhumbal is a home game and groups vary the show limit and penalty, so you can change the limit when you start.</p>`,
 rummy:`<h4>Setup</h4><p>Two 52-card decks. Each player gets 13 cards. One card is cut and placed under the closed deck: every card of that rank, in any suit, is a <b>joker</b> for this deal (marked with a gold star). Printed jokers are not used here.</p>
 <h4>Your turn</h4><ul><li>Draw one card, from the closed deck or the top of the open pile.</li><li>Discard one card to the open pile. You can’t discard the card you just took from the open pile.</li></ul>
 <h4>Groups</h4><ul><li><b>Pure sequence</b>: 3 or more cards in a row of one suit, with no joker standing in for a missing card. A can be low (A-2-3) or high (Q-K-A), but not K-A-2.</li><li><b>Sequence</b>: the same, with jokers filling gaps.</li><li><b>Set</b>: 3 or 4 cards of the same rank in different suits, jokers allowed.</li></ul>
 <h4>Declaring</h4><p>When all 13 cards (after your discard) form groups, with at least two sequences and at least one of them pure, you can Declare. Your hand is arranged automatically into its best groups.</p>
 <h4>Scoring</h4><ul><li>A, K, Q, J and 10 count 10; other cards count face value; jokers count 0.</li><li>Without a pure sequence, every card counts. With a pure sequence but no second sequence, everything except the pure sequence counts. Otherwise only unmatched cards count. A hand scores at most 80.</li><li><b>Drop</b>: give up the deal for 20 points before your first draw, or 40 later.</li><li>The declarer scores 0. After the last deal, the lowest total wins.</li></ul>`
};
RULES.kachuful=`<h4>Rounds</h4><p>Each round deals one card fewer than the last (for example 8, 7 … 1). Trump rotates in the order that gives the game its name: <b>Ka</b>ali ♠, <b>Chu</b>kat ♦, <b>Phu</b>li ♣, <b>L</b>aal ♥. Play passes to the right.</p>
 <h4>Calling</h4><p>Starting to the dealer’s right, everyone calls exactly how many tricks they will win. Zero is allowed. The dealer calls last and may not call the number that makes the total equal to the cards in hand, so somebody always misses.</p>
 <h4>Play</h4><ul><li>Follow the suit led if you can. If you can’t, play any card, trump or not.</li><li>The highest trump wins; if there is none, the highest card of the led suit wins. The winner leads next.</li></ul>
 <h4>Scoring</h4><p>Take exactly your call: score 10 plus the call (call 2, take 2 = 12; call 0, take 0 = 10). Take more or fewer: score 0. Highest total after the last round wins. Some groups score calls differently; this is the most common way.</p>`;
RULES.kitti=`<h4>Setup</h4><p>Everyone puts the boot in the pot and gets 9 cards. Split them into three hands of three: your 1st, 2nd and 3rd hand. Your best split is set for you; tap two cards to swap them, or tap Auto arrange.</p>
 <h4>Hand ranks (Flash)</h4><p>Trial (three of a kind) › Double run (pure sequence) › Run › Color › Jute (pair) › Top (high card). A-K-Q is the highest run, then A-2-3.</p>
 <h4>Shows</h4><ul><li>All 1st hands are shown and compared; the best wins the 1st show. Then the 2nd hands, then the 3rd.</li><li>If the best hands tie exactly, nobody wins that show.</li><li>Win two shows and you take the pot.</li><li>If nobody wins two shows it is <b>Kitti</b>: the pot stays on the table and is added to the next deal.</li></ul>
 <p>Groups differ on details, such as requiring the 1st hand to be the strongest. Here you may order your hands any way you like.</p>`;
RULES.marriage=`<h4>Setup</h4><p>Three decks shuffled together. Each player gets 21 cards. One card is set aside face down: the <b>maal</b>. One card starts the discard pile. Play passes to the right.</p>
 <h4>Your turn</h4><ul><li>Draw from the deck, or take the top discard. You may only take the discard if it completes a group with two cards in your hand (or a dublee, if you are collecting dublees).</li><li>Then throw one card. You can’t throw back the card you just took.</li></ul>
 <h4>Seeing the maal</h4><p>Lay down three groups of three: <b>pure sequences</b> (three in a row, one suit, A-2-3 and Q-K-A allowed) or <b>tunnelas</b> (three identical cards). Then you see the maal. Before that, you can’t use jokers or score maal points.</p>
 <h4>Maal cards (all are jokers once you’ve seen)</h4><ul><li><b>Tiplu</b>: the same card as the maal, 3 points.</li><li><b>Poplu</b>: one rank higher, same suit, 2 points. <b>Jhiplu</b>: one rank lower, same suit, 2 points.</li><li><b>Alter</b>: same rank, same color, other suit, 5 points.</li><li>Same rank in the other color: ordinary joker, 0 points.</li><li>Jhiplu + Tiplu + Poplu together is a <b>Marriage</b>: 10 points instead of 7. Each tunnela you showed is worth 5.</li></ul>
 <h4>Finishing</h4><p>After seeing the maal, finish (“game”) when your remaining cards, after your throw, all form groups of three: sequences, trials (three of a rank in different suits) or tunnelas. Jokers may fill gaps.</p>
 <h4>Settlement</h4><ul><li>Add up everyone’s maal points (T). Each player scores (players × own maal) − T.</li><li>The winner also collects 3 from each player who saw the maal and 10 from each who didn’t.</li><li><b>Murder</b>: players who never saw the maal count 0 maal. <b>Kidnap</b>: their maal goes to the winner.</li></ul>
 <h4>Dublees</h4><ul><li>A dublee is two identical cards (same rank and suit). Instead of three sequences, you can show <b>seven dublees</b> to see the maal.</li><li>A dublee player goes out by holding an <b>eighth dublee</b> after drawing; the other cards don’t matter. Each opponent then pays 5 extra.</li><li>Jokers can’t stand in for a dublee card. After seeing, a dublee player may only take the discard if it makes the eighth dublee.</li></ul>
 <p>Once you have seen the maal by sequences, you can’t pick up a discarded joker. The highest total after the last deal wins.</p>`;
RULES.flash=RULES.teenpatti.replace('<b>Trail</b>: three of a kind. A-A-A is highest.','<b>Trial</b>: three of a kind. A-A-A is highest.').replace('<b>Pure sequence</b>','<b>Double run</b>').replace('<b>Sequence</b>: three in a row, mixed suits','<b>Run</b>: three in a row, mixed suits').replace('<b>Pair</b>: two of a kind.','<b>Jute</b>: a pair.').replace('<b>High card</b>: none of the above.','<b>Top</b>: high card.');
const LAST={};try{Object.assign(LAST,JSON.parse(localStorage.getItem('taas.last')||'{}'))}catch(e){}

function miniCard(id,x,rot){const c=newDeck().find(d=>d.id===id);return`<div class="card static" style="transform:translate(calc(-50% + ${x}px),0) rotate(${rot}deg);position:absolute"><div class="inner">${faceHTML(c)}</div></div>`}

  $('#tiles').innerHTML=CATALOG.map(g=>{const st=STATS[g.key];const n=g.fan.length;
    return`<button class="tile" data-g="${g.key}"><div class="fan">${g.fan.map((id,k)=>miniCard(id,(k-(n-1)/2)*26,(k-(n-1)/2)*9)).join('')}</div><div class="tb"><span class="meta">${g.meta}</span><h2>${g.name}</h2><p>${g.desc}</p><span class="st">${st?`Played ${st.p} · Won ${st.w}`:'Not played yet'}</span></div></button>`}).join('');

}
function segHTML(id,choices,cur){return`<div class="seg" data-f="${id}">${choices.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(v)===String(cur)}">${l}</button>`).join('')}</div>`}
function wireSegs(root,onPick){root.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');onPick&&onPick(s.dataset.f,b.dataset.v)}))}
async function setup(key){
  const g=CATALOG.find(x=>x.key===key),last=LAST[key]||{};
  const body=g.opts.map(o=>`<div class="field"><span>${o.label}</span>${segHTML(o.id,o.choices,last[o.id]??o.def)}</div>`).join('')+`<div class="field"><span>Computer players</span>${segHTML('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard']],S.diff)}</div>`;
  const p=modal({title:g.name,body:`<p style="color:var(--muted);margin:0 0 6px">${g.desc}</p>`+body,buttons:[{label:'Rules',value:'rules'},{label:'Cancel',value:'cancel'},{label:'Deal cards',value:'go',primary:true}]});
  wireSegs($('#sheet'));const v=await p;
  if(v==='rules'){await modal({title:`How to play ${g.name}`,body:RULES[key],buttons:[{label:'Back',value:1,primary:true}],wide:true});return setup(key)}
  if(v!=='go')return;
  const opts={};g.opts.forEach(o=>{const b=$(`#sheet .seg[data-f="${o.id}"] [aria-pressed=true]`);opts[o.id]=b?(isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v):o.def});
  const db=$('#sheet .seg[data-f="diff"] [aria-pressed=true]');if(db){S.diff=db.dataset.v;saveS()}
  LAST[key]=opts;try{localStorage.setItem('taas.last',JSON.stringify(LAST))}catch(e){}
  startGame(key,opts)}
async function startGame(key,opts){
  stopGame();$('#lobby').hidden=true;['#bMenu','#ttl','#bRules'].forEach(s=>$(s).hidden=false);
  G=key==='callbreak'?new CallBreak(opts):key==='dhumbal'?new Dhumbal(opts):key==='rummy'?new Rummy(opts):key==='kachuful'?new Kachuful(opts):key==='kitti'?new Kitti(opts):key==='marriage'?new Marriage(opts):new TeenPatti(opts,key==='flash');
  $('#tTitle').textContent=G.title;const pr=G.print();$('#print').innerHTML=`${esc(pr[0])}<small>${esc(pr[1])}</small>`;
  buildSeats();lastCenter='';render();
  let r=null;try{r=await G.run()}catch(e){if(!(e instanceof Abort)){console.error(e);msg('Something went wrong: '+e.message)}return}
  if(opts.seats&&MP.role==='host'){if(r==='again')mpStart();else mpBackToRoom();return}
  if(r==='again')startGame(key,opts);else toLobby()}
function stopGame(){TOKEN++;if(PEND){const p=PEND;PEND=null;p.rej(new Abort())}if(MPEND){const m=MPEND;closeModal();m.rej(new Abort())}
  setActions([]);msg('');hideAll();seatsLayer.innerHTML='';$('#labels').innerHTML='';seatEls=[];$('#center').innerHTML='';lastCenter='';$('#fx').innerHTML='';G=null}
function toLobby(){stopGame();$('#lobby').hidden=false;['#bMenu','#ttl','#bRules'].forEach(s=>$(s).hidden=true);$('#print').innerHTML='TAAS ADDA<small>EST. KATHMANDU</small>';$('#confirm').hidden=true;buildLobby()}

function applySettings(){document.documentElement.dataset.felt=S.felt;app.classList.remove('bk-crimson','bk-navy','bk-jade');app.classList.add('bk-'+S.back);app.classList.toggle('four',!!S.four);

  $('#bSound').setAttribute('aria-label',S.sound?'Mute sound':'Turn sound on')}

  <div class="field"><span>Computer players</span>${segHTML('diff',[['easy','Easy'],['normal','Normal'],['hard','Hard']],S.diff)}</div>
  <div class="field"><span>Sound</span>${segHTML('sound',[['1','On'],['0','Off']],S.sound?'1':'0')}</div>`;
  const p=modal({title:'Settings',body,buttons:[{label:'Done',value:1,primary:true}]});

const NATIVE=typeof window.TaasNative!=='undefined';
const MOCK=/[?&]mock\b/.test(location.search);
const MP={on:false,role:null,net:null,seats:[],seat:0,inGame:false,screen:'',asks:{},chat:[],unread:0,found:{},hostName:'',rounds:5};
class Link{constructor(){this.h={}}on(e,f){(this.h[e]=this.h[e]||[]).push(f)}emit(e,d){(this.h[e]||[]).forEach(f=>{try{f(d)}catch(err){console.error(err)}})}}
class NativeLink extends Link{
  host(name){TaasNative.startHost(name)}discover(name){TaasNative.startDiscovery(name)}stopDiscovery(){TaasNative.stopDiscovery()}
  connect(id,name){TaasNative.connect(id,name)}send(id,o){TaasNative.send(id,JSON.stringify(o))}drop(id){TaasNative.disconnect(id)}stop(){TaasNative.stopAll()}}
class MockLink extends Link{
  constructor(){super();this.me='m'+Math.random().toString(36).slice(2,8);this.mode=null;this.peers=new Set();this.bc=new BroadcastChannel('taas-mock');this.bc.onmessage=e=>this.got(e.data)}
  post(o){this.bc.postMessage(Object.assign({from:this.me},o))}
  got(m){if(m.to&&m.to!==this.me)return;
    if(m.k==='adv'&&this.mode==='disc')this.emit('found',{id:m.from,name:m.name});
    else if(m.k==='who'&&this.mode==='host')this.post({k:'adv',name:this.name});
    else if(m.k==='req'&&this.mode==='host'){this.peers.add(m.from);this.post({k:'ok',to:m.from,name:this.name});this.emit('connected',{id:m.from,name:m.name})}
    else if(m.k==='ok'&&this.mode==='disc'){this.peers.add(m.from);this.emit('connected',{id:m.from,name:m.name})}
    else if(m.k==='msg'&&this.peers.has(m.from))this.emit('message',{id:m.from,data:m.data});
    else if(m.k==='bye'&&this.peers.has(m.from)){this.peers.delete(m.from);this.emit('disconnected',{id:m.from})}}
  host(name){this.mode='host';this.name=name;this.post({k:'adv',name})}
  discover(name){this.mode='disc';this.name=name;this.post({k:'who'})}
  stopDiscovery(){}
  connect(id,name){this.post({k:'req',to:id,name})}
  send(id,o){this.post({k:'msg',to:id,data:JSON.stringify(o)})}
  drop(id){this.post({k:'bye',to:id});this.peers.delete(id)}
  stop(){this.peers.forEach(p=>this.post({k:'bye',to:p}));this.peers.clear();this.mode=null}}
window.__native=ev=>{if(!ev)return;if(ev.type==='location'){const cb=window.__locCb;window.__locCb=null;if(cb)cb(ev.lat!=null?{lat:+ev.lat,lng:+ev.lng,acc:+ev.acc}:null);return}
  if(MP.net)MP.net.emit(ev.type,ev)};
function mpNet(){if(MP.net)return MP.net;const n=NATIVE?new NativeLink():new MockLink();MP.net=n;
  n.on('found',e=>{MP.found[e.id]=e.name;if(MP.screen==='join')mpRender()});
  n.on('lost',e=>{delete MP.found[e.id];if(MP.screen==='join')mpRender()});
  n.on('connected',e=>mpConnected(e.id,e.name||'Player'));
  n.on('disconnected',e=>mpDisconnected(e.id));
  n.on('connectFailed',()=>{if(MP.screen==='connecting'){MP.screen='join';MP.err='Couldn’t join that table. Try again.';mpRender()}});
  n.on('error',e=>{MP.err=/permission/i.test(e.msg||'')?'Taas Adda needs Bluetooth, Nearby devices and Location permission to connect phones.':'Nearby connection error: '+(e.msg||'unknown');mpRender()});
  n.on('message',e=>mpMessage(e.id,e.data));return n}
function mpSend(o){if(MP.role==='client'&&MP.hostId)MP.net.send(MP.hostId,o)}
function mpBroadcast(o,except){if(MP.role!=='host'||!MP.on)return;MP.seats.forEach(s=>{if(s&&s.id&&s.id!==except)MP.net.send(s.id,o)})}
let mpSyncT=null;
function mpSync(){if(mpSyncT)return;mpSyncT=setTimeout(()=>{mpSyncT=null;if(!(MP.role==='host'&&G&&G.viewFor))return;G.players.forEach((p,s)=>{if(p.remote)MP.net.send(p.remote,{t:'view',v:G.viewFor(s)})})},40)}
function mpLocal(seat){const n=(G&&G.n)||(G&&G.players&&G.players.length)||4;return MP.role==='client'?(seat-MP.seat+n)%n:seat}
function mpLobbyMsg(){MP.seats.forEach((s,i)=>{if(s&&s.id)MP.net.send(s.id,{t:'lobby',seats:MP.seats.map(x=>x&&{name:x.name}),you:i,host:S.name,rounds:MP.rounds})})}

/* --- screens --- */
function mpShow(screen){MP.screen=screen;MP.err='';$('#mp').hidden=false;mpRender()}
function mpHide(){$('#mp').hidden=true;MP.screen=''}
function seatRows(){return`<div class="seatlist">${[0,1,2,3].map(i=>{const s=MP.seats[i];return`<div class="seatrow"><div class="av" style="--av:${s?(i===0?'#dcb565':AVC[(i+2)%AVC.length]):'#3a3029'}">${s?esc(s.name[0]||'?'):''}</div><span>${s?esc(s.name):'Open seat'}${MP.role==='client'&&i===MP.seat?' <small>· you</small>':''}${i===0?' <small>· host</small>':''}</span><small>${s?'':'bot plays'}</small></div>`}).join('')}</div>`}
function mpRender(){const sh=$('#mpSheet');if($('#mp').hidden)return;const err=MP.err?`<p class="hint" style="color:#ffb4ab">${esc(MP.err)}</p>`:'';let h='';
  if(MP.screen==='entry')h=`<h3>Play with friends nearby</h3><div class="body"><p class="hint">Phones connect directly over Bluetooth and Wi-Fi. No internet needed. Everyone opens Taas Adda: one person hosts, the others join. Up to 4 players; empty seats are played by bots.</p><p class="hint">Game: <b>Call Break</b>. More games are coming to nearby play.</p><p class="hint">Your phone will ask for <b>Nearby devices</b> permission (or <b>Location</b> on Android 12 and older). Android needs it to find nearby phones over Bluetooth; Taas Adda doesn’t record or upload your location.</p>${err}</div><div class="btns"><button class="btn" data-a="close">Cancel</button><button class="btn" data-a="join">Join a table</button><button class="btn primary" data-a="host">Host a table</button></div>`;
  else if(MP.screen==='host')h=`<h3>Your table · Call Break</h3><div class="body">${seatRows()}<p class="hint" style="margin-top:10px"><span class="spin"></span>Open for friends. They tap <b>Play with friends nearby → Join a table</b>.</p><div class="field" style="margin-top:8px"><span>Rounds</span>${segHTML('mprounds',[[3,'3'],[5,'5'],[7,'7']],MP.rounds)}</div>${err}</div><div class="btns"><button class="btn" data-a="leave">Close table</button><button class="btn" data-a="chat">Chat</button><button class="btn primary" data-a="start">Start game</button></div>`;
  else if(MP.screen==='join'){const ids=Object.keys(MP.found);h=`<h3>Tables nearby</h3><div class="body">${ids.length?`<div class="tablelist">${ids.map(id=>`<button class="btn" data-a="pick" data-id="${esc(id)}"><span>${esc(MP.found[id])}</span><small>Join</small></button>`).join('')}</div>`:'<p class="hint"><span class="spin"></span>Looking for tables… Keep both phones close, with Bluetooth on.</p>'}${err}</div><div class="btns"><button class="btn" data-a="leave">Cancel</button></div>`}
  else if(MP.screen==='connecting')h=`<h3>Joining…</h3><div class="body"><p class="hint"><span class="spin"></span>Connecting to the table.</p></div><div class="btns"><button class="btn" data-a="leave">Cancel</button></div>`;
  else if(MP.screen==='wait')h=`<h3>${esc(MP.hostName)}’s table</h3><div class="body">${seatRows()}<p class="hint" style="margin-top:10px"><span class="spin"></span>Waiting for ${esc(MP.hostName)} to start Call Break (${MP.rounds} rounds).</p></div><div class="btns"><button class="btn" data-a="leave">Leave table</button><button class="btn primary" data-a="chat">Chat</button></div>`;
  sh.className='sheet';sh.innerHTML=h;
  wireSegs(sh,(f,v)=>{if(f==='mprounds'){MP.rounds=+v;mpLobbyMsg()}});
  sh.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ac();const a=b.dataset.a;
    if(a==='close')mpHide();else if(a==='host')mpHost();else if(a==='join')mpJoin();else if(a==='leave')mpLeave();else if(a==='start')mpStart();else if(a==='chat')chatOpen();
    else if(a==='pick'){MP.screen='connecting';mpRender();MP.hostName=MP.found[b.dataset.id];mpNet().connect(b.dataset.id,S.name||'Player')}})}
function mpHost(){const n=mpNet();Object.assign(MP,{on:true,role:'host',seats:[{name:S.name||'You',id:null},null,null,null],seat:0,chat:[],unread:0,inGame:false});n.host(`${S.name||'Player'}’s table`);applyMpUi();mpShow('host');chatSys('You opened the table.')}
function mpJoin(){const n=mpNet();Object.assign(MP,{on:false,role:'client',found:{},chat:[],unread:0,inGame:false});n.discover(S.name||'Player');mpShow('join')}
function mpConnected(id,name){
  if(MP.role==='host'){if(MP.inGame){MP.net.send(id,{t:'end',reason:'The game has already started.'});setTimeout(()=>MP.net.drop(id),300);return}
    const i=MP.seats.findIndex((s,k)=>k>0&&!s);if(i<0){MP.net.send(id,{t:'end',reason:'The table is full.'});setTimeout(()=>MP.net.drop(id),300);return}
    MP.seats[i]={name:String(name).slice(0,14),id};mpLobbyMsg();chatSys(`${name} joined.`,true);sfx('tick');mpRender()}
  else{MP.on=true;MP.hostId=id;MP.net.stopDiscovery();applyMpUi();MP.screen='wait';sfx('tick')}}
function mpDisconnected(id){
  if(MP.role==='host'){const i=MP.seats.findIndex(s=>s&&s.id===id);if(i<0)return;const nm=MP.seats[i].name;MP.seats[i]=null;chatSys(`${nm} left.`,true);
    if(MP.inGame&&G&&G.players&&G.players[i]){const p=G.players[i];p.remote=null;p.bot=true;p.name=nm+' (bot)';const r=MP.asks[i];if(r){delete MP.asks[i];r('__bot')}render()}else{mpLobbyMsg();mpRender()}}
  else if(id===MP.hostId)mpLeave('The host closed the table.')}
function mpStart(){if(MP.role!=='host')return;MP.inGame=true;mpHide();
  MP.seats.forEach((s,i)=>{if(s&&s.id)MP.net.send(s.id,{t:'start',seat:i,n:4,seats:MP.seats.map(x=>x&&{name:x.name}),rounds:MP.rounds})});
  startGame('callbreak',{rounds:MP.rounds,seats:MP.seats.map(x=>x&&{name:x.name,id:x.id})})}
function mpBackToRoom(){MP.inGame=false;MP.asks={};toLobby();mpLobbyMsg();mpShow('host')}
function mpLeave(reason){const n=MP.net;if(n){if(MP.role==='host')mpBroadcast({t:'end',reason:`${S.name} closed the table.`});setTimeout(()=>n.stop(),200)}
  Object.assign(MP,{on:false,role:null,seats:[],inGame:false,asks:{},hostId:null,found:{}});mpHide();chatClose();applyMpUi();toLobby();
  if(reason)modal({title:'Table closed',body:`<p>${esc(reason)}</p>`,buttons:[{label:'OK',value:1,primary:true}]}).catch(()=>{})}
function mpMessage(id,data){let m;try{m=JSON.parse(data)}catch(e){return}
  if(MP.role==='host'){const seat=MP.seats.findIndex(s=>s&&s.id===id);if(seat<0)return;const nm=MP.seats[seat].name;
    if(m.t==='act'){const r=MP.asks[seat];if(r){delete MP.asks[seat];r(m.v)}}
    else if(m.t==='chat')chatAdd({name:nm,seat,text:String(m.text||'').slice(0,200)},true);
    else if(m.t==='emo')emoShow(seat,String(m.e||'').slice(0,4),true);
    else if(m.t==='sos')sosReceive({name:nm,seat,text:String(m.text||'').slice(0,300),link:String(m.link||'').slice(0,120),time:Date.now()},true);
    return}
  switch(m.t){
    case'lobby':MP.seats=m.seats;MP.seat=m.you;MP.hostName=m.host;MP.rounds=m.rounds;if(MP.inGame){MP.inGame=false;stopGame();$('#lobby').hidden=false;['#bMenu','#ttl','#bRules'].forEach(s=>$(s).hidden=true)}mpShow('wait');break;
    case'start':mpClientStart(m);break;
    case'view':if(G&&G.remote){G.setView(m.v);render()}break;
    case'ask':clientAsk(m.q);break;
    case'bub':if(G&&G.remote)bubble(mpLocal(m.seat),m.text,m.ms,true);break;
    case'modal':closeModal();modal({title:m.title,body:m.body,buttons:[{label:'OK',value:1,primary:true}],wide:true}).catch(()=>{});break;
    case'chat':chatAdd(m,false);break;
    case'emo':emoShow(m.seat,m.e,false);break;
    case'sos':sosReceive(m,false);break;
    case'end':mpLeave(m.reason||'The table was closed.');break}}

/* --- client-side game view --- */
const CARD_BY_ID=Object.fromEntries(newDeck().map(c=>[c.id,c]));const GHOSTS={};
const ghost=id=>GHOSTS[id]||(GHOSTS[id]={id:'g-'+id,r:2,s:'S'});
class RemoteCB{
  constructor(seat,n,seats,rounds){this.key='callbreak';this.title='Call Break';this.remote=true;this.seat=seat;this.n=n;this.v=null;this.legalSet=null;this.cur=-1;this.dealer=-1;
    this.players=[];for(let l=0;l<n;l++){const st=seats[(l+seat)%n];this.players[l]={name:st?st.name:'Bot',color:l===0?'#dcb565':AVC[((l+seat)%n+2)%AVC.length]}}this.rounds=rounds}
  li(s){return(s-this.seat+this.n)%this.n}rs(l){return(l+this.seat)%this.n}
  setView(v){const pv=this.v;this.v=v;for(let l=0;l<this.n;l++){const p=v.players[this.rs(l)];this.players[l]=Object.assign({},p,{color:l===0?'#dcb565':p.color})}
    this.cur=v.cur<0?-1:this.li(v.cur);this.dealer=this.li(v.dealer);if(pv&&(pv.trick.length<v.trick.length||(pv.pile>v.pile&&v.pile%2===0)))sfx('card')}
  print(){return['CALL BREAK','SPADES ARE TRUMP']}
  subtitle(){return this.v?`Round ${this.v.round} of ${this.v.rounds} · ${MP.hostName}’s table`:`${MP.hostName}’s table`}
  deckPos(){return{x:cx,y:cy}}
  seatInfo(i){const p=this.players[i]||{};if(!this.v)return{sub:'',tag:''};const t=Math.round((p.scores||[]).reduce((a,b)=>a+b,0)*10)/10;return{sub:this.v.phase==='bid'&&!p.bid?'Bidding…':p.bid?`Bid ${p.bid} · Won ${p.tricks}`:'',tag:t.toFixed(1)}}
  placements(){const L=[],v=this.v;if(!v)return L;
    for(let k=0;k<v.pile;k++)L.push({c:ghost('p'+k),x:cx+k*.18,y:cy-k*.32,t:26,up:false,z:k+1,s:.9,flat:k>0});
    const o={S:0,H:1,C:2,D:3};const hand=v.hand.map(id=>CARD_BY_ID[id]).sort((a,b)=>o[a.s]-o[b.s]||b.r-a.r);
    this.handSpan=humanFan(hand,L,{legal:this.legalSet});
    for(let l=1;l<this.n;l++){const s=this.rs(l),cs=[];for(let k=0;k<v.players[s].hc;k++)cs.push(ghost('h'+s+'_'+k));oppFan(l,this.n,cs,L)}
    v.trick.forEach((tc,k)=>{const l=this.li(tc.p),sp=seatPt(l,this.n);L.push({c:CARD_BY_ID[tc.id],x:cx+(sp.x-cx)*.27,y:cy+(sp.y-cy)*.3,r:jit(tc.id,14),t:22,up:true,z:300+k,s:.86,glow:v.glow===tc.id,from:lerp(sp,{x:cx,y:cy},.3)})});
    v.players.forEach((p,s)=>{const l=this.li(s),sp=seatPt(l,this.n),a=seatAng(l,this.n);const q=l===0?{x:cx+CW*2.1,y:cy+ry*.62}:lerp({x:sp.x-Math.sin(a)*CW*1.1,y:sp.y+Math.cos(a)*CW*1.1},{x:cx,y:cy},.12);
      p.won.forEach((id,k)=>L.push({c:CARD_BY_ID[id],x:q.x+Math.floor(k/4)*.8,y:q.y-Math.floor(k/4)*1.4,r:jit(id,30)+(k%4)*4,t:26,up:false,s:.42,z:100+k}))});
    return L}
  onCard(id){if(this.legalSet&&this.legalSet.has(id)){this.legalSet=null;msg('');mpSend({t:'act',v:id});sfx('card');render()}}
}
function mpClientStart(m){stopGame();closeModal();mpHide();MP.inGame=true;MP.seat=m.seat;$('#lobby').hidden=true;['#bMenu','#ttl','#bRules'].forEach(s=>$(s).hidden=false);
  G=new RemoteCB(m.seat,m.n,m.seats,m.rounds);$('#tTitle').textContent=G.title;const pr=G.print();$('#print').innerHTML=`${esc(pr[0])}<small>${esc(pr[1])}</small>`;buildSeats();lastCenter='';render()}
function clientAsk(q){if(!G||!G.remote)return;
  if(q.k==='bid'){setActions([1,2,3,4,5,6,7,8].map(v=>({label:String(v),value:v,kind:'bid'+(v===q.sug?' sug':'')})),{center:true,title:'Your bid',hint:`How many tricks will you take? Suggested: ${q.sug}`});
    waitHuman().then(v=>{setActions([]);mpSend({t:'act',v})}).catch(()=>{})}
  else if(q.k==='play'){G.legalSet=new Set(q.legal);msg(q.lead?'Your lead: play any card':'Your turn');sfx('tick');render()}}

/* --- chat & emoji --- */
const EMOJI=['😂','👏','🔥','😎','😡','😭','🙏','👍','🤞','💀'];
function applyMpUi(){$('#bChat').hidden=!MP.on;$('#chatDot').hidden=!MP.unread;$('#lNear').hidden=!(NATIVE||MOCK)}
function chatOpen(){if(!MP.on)return;$('#chat').hidden=false;MP.unread=0;applyMpUi();chatRender();setTimeout(()=>{try{$('#chatIn').focus()}catch(e){}},50)}
function chatClose(){$('#chat').hidden=true}
function chatRender(){const log=$('#chatLog');log.innerHTML=MP.chat.map(m=>m.sys?`<div class="m sys">${esc(m.text)}</div>`:`<div class="m${m.sos?' sos':''}"><b>${esc(m.name)}</b>${esc(m.text)}</div>`).join('')||'<div class="m sys">Say hello to the table.</div>';log.scrollTop=log.scrollHeight}
function chatPush(m){MP.chat.push(m);if(MP.chat.length>150)MP.chat.shift();if($('#chat').hidden&&!m.sys){MP.unread++;applyMpUi()}chatRender()}
function chatSys(text,relay){chatPush({sys:true,text});if(relay)mpBroadcast({t:'chat',sys:true,text})}
function chatAdd(m,relay){chatPush(m);if(!m.sys&&G&&$('#chat').hidden)bubble(mpLocal(m.seat),m.text.length>28?m.text.slice(0,27)+'…':m.text,2600,true);if(!m.sys)sfx('tick');if(relay)mpBroadcast(Object.assign({t:'chat'},m))}
function emoShow(seat,e,relay){if(G)bubble(mpLocal(seat),e,1800,true);if(relay)mpBroadcast({t:'emo',seat,e})}
function chatSend(text){text=text.trim();if(!text)return;if(MP.role==='host')chatAdd({name:S.name,seat:0,text},true);else mpSend({t:'chat',text})}
function emoSend(e){sfx('tick');if(MP.role==='host')emoShow(0,e,true);else mpSend({t:'emo',e})}
$('#emoRow').innerHTML=EMOJI.map(e=>`<button type="button" data-e="${e}" aria-label="Send ${e}">${e}</button>`).join('');
$('#emoRow').onclick=e=>{const b=e.target.closest('[data-e]');if(b)emoSend(b.dataset.e)};
$('#chatForm').onsubmit=e=>{e.preventDefault();chatSend($('#chatIn').value);$('#chatIn').value=''};
$('#chatX').onclick=chatClose;$('#bChat').onclick=()=>{$('#chat').hidden?chatOpen():chatClose()};
$('#lNear').onclick=()=>{ac();if(MP.on){mpShow(MP.role==='host'?'host':'wait')}else mpShow('entry')};

/* --- SOS --- */
const EMERG={NP:{label:'Nepal',nums:[['Police','100'],['Ambulance','102'],['Fire','101']]},IN:{label:'India',nums:[['Emergency','112'],['Ambulance','108']]},KR:{label:'Korea',nums:[['Police','112'],['Fire & ambulance','119']]},US:{label:'USA / Canada',nums:[['Emergency','911']]},EU:{label:'Europe / other',nums:[['Emergency','112']]}};
if(!S.sosCountry)S.sosCountry='NP';if(S.sosContacts==null)S.sosContacts='';
function getLoc(){return new Promise(res=>{let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin(null),15000);
  if(NATIVE){window.__locCb=fin;try{TaasNative.getLocation()}catch(e){fin(null)}return}
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>fin({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),()=>fin(null),{enableHighAccuracy:true,timeout:12000});else fin(null)})}
function openExt(url){if(NATIVE)TaasNative.openUrl(url);else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}}
function sosOpen(){const c=EMERG[S.sosCountry]||EMERG.NP;
  $('#sosSheet').innerHTML=`<h3>Emergency</h3><div class="body" style="display:flex;flex-direction:column;gap:12px">
    <p class="hint" style="margin:0">If you are in danger, <b>call emergency services first</b>. Taas Adda can alert your friends, but it does not contact the police or ambulance for you.</p>
    <div class="field"><span>Call now · ${esc(c.label)}</span><div class="numbers">${c.nums.map(([l,n])=>`<button class="btn" data-call="${n}">${esc(l)}<small>${n}</small></button>`).join('')}</div>${NATIVE?'':`<p class="hint" style="margin:4px 0 0">On this device, dial the number yourself if the button doesn’t open your phone app.</p>`}</div>
    <div class="field"><label for="sosText">Message</label><textarea id="sosText" maxlength="300">I need help.</textarea></div>
    <label class="check"><input type="checkbox" id="sosLoc" checked> Include my current location</label>
    <button class="btn big" id="sosTable"${MP.on?'':' disabled'}>Alert everyone at this table</button>
    <div class="field"><label for="sosNums">Emergency contacts (phone numbers, separated by commas)</label><input type="text" id="sosNums" inputmode="tel" value="${esc(S.sosContacts)}" placeholder="+977 98…, +82 10…"></div>
    <button class="btn" id="sosSms">Text my emergency contacts</button>
    <div class="field"><span>Country for emergency numbers</span>${segHTML('sosc',Object.entries(EMERG).map(([k,v])=>[k,v.label]),S.sosCountry)}</div>
    <div class="sosstatus" id="sosStatus" role="status"></div></div>
    <div class="btns"><button class="btn primary" id="sosClose">Close</button></div>`;
  $('#sos').hidden=false;const sh=$('#sosSheet');
  wireSegs(sh,(f,v)=>{S.sosCountry=v;saveS();sosOpen()});
  sh.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{const n=b.dataset.call;if(NATIVE)TaasNative.dial(n);else openExt('tel:'+n);$('#sosStatus').textContent=`Calling ${n}…`});
  $('#sosNums').onchange=e=>{S.sosContacts=e.target.value.trim();saveS()};
  $('#sosClose').onclick=()=>{$('#sos').hidden=true};
  $('#sosTable').onclick=()=>sosSend('table');$('#sosSms').onclick=()=>sosSend('sms')}
async function sosSend(kind){const st=$('#sosStatus');const text=($('#sosText').value.trim()||'I need help.').slice(0,300);
  if(kind==='sms'){S.sosContacts=$('#sosNums').value.trim();saveS();if(!S.sosContacts){st.textContent='Add at least one phone number first.';$('#sosNums').focus();return}}
  let link='';if($('#sosLoc').checked){st.innerHTML='<span class="spin"></span>Getting your location…';const loc=await getLoc();
    if(loc)link=`https://maps.google.com/?q=${loc.lat.toFixed(6)},${loc.lng.toFixed(6)}`;else st.textContent='Location unavailable. Sending without it.'}
  if(kind==='table'){const m={name:S.name,seat:MP.role==='host'?0:MP.seat,text,link,time:Date.now()};if(MP.role==='host')sosReceive(m,true);else mpSend({t:'sos',text,link});
    chatPush({name:S.name,text:'🚨 SOS: '+text+(link?' '+link:''),sos:true});st.textContent='Alert sent to everyone at the table.'+(link?' Your location was included.':'')}
  else{const body=`SOS from ${S.name}: ${text}${link?' My location: '+link:''}`;const nums=S.sosContacts.split(/[,;]/).map(x=>x.replace(/[^\d+]/g,'')).filter(Boolean);
    if(NATIVE)TaasNative.sms(nums.join(','),body);else openExt(`sms:${nums.join(',')}?body=${encodeURIComponent(body)}`);
    st.textContent='Your messaging app is open with the SOS message. Press send there.'}}
let sirenT=null;
function siren(sec){const a=ac();if(!a)return;let t=a.currentTime;for(let k=0;k<sec*2;k++){const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(700,t);o.frequency.linearRampToValueAtTime(1300,t+.45);g.gain.setValueAtTime(.08,t);g.gain.linearRampToValueAtTime(.0001,t+.5);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.5);t+=.5}}
function sosReceive(m,relay){if(relay)mpBroadcast(Object.assign({t:'sos'},m));
  const mine=(MP.role==='host'&&m.seat===0)||(MP.role==='client'&&m.seat===MP.seat);if(mine)return;
  chatPush({name:m.name,text:'🚨 SOS: '+m.text+(m.link?' '+m.link:''),sos:true});
  $('#sosBox').innerHTML=`<div style="font-size:54px">🚨</div><h2>${esc(m.name)} needs help</h2><p>“${esc(m.text)}”</p>${m.link?`<p style="font-size:13.5px;opacity:.9">Location: <span style="-webkit-user-select:text;user-select:text">${esc(m.link)}</span></p><button class="btn primary" id="sosMap">Open location in Maps</button>`:'<p style="font-size:13.5px;opacity:.85">No location was shared.</p>'}<button class="btn" id="sosReply">Tell them I’m coming</button><button class="btn" id="sosDismiss">Dismiss</button>`;
  $('#sosAlert').hidden=false;if(NATIVE)try{TaasNative.vibrate(2500)}catch(e){}else if(navigator.vibrate)navigator.vibrate([500,200,500,200,800]);siren(4);
  if($('#sosMap'))$('#sosMap').onclick=()=>openExt(m.link);
  $('#sosReply').onclick=()=>{chatSend(`I saw your SOS, ${m.name}. I’m on my way / calling for help.`);$('#sosAlert').hidden=true};
  $('#sosDismiss').onclick=()=>{$('#sosAlert').hidden=true}}
$('#bSos').onclick=()=>{ac();sosOpen()};

/* --- Android back button --- */
window.__back=()=>{if(!$('#sosAlert').hidden){$('#sosAlert').hidden=true;return true}if(!$('#sos').hidden){$('#sos').hidden=true;return true}
  if(!$('#chat').hidden){chatClose();return true}if(!$('#confirm').hidden){$('#confirm').hidden=true;return true}
  if(!$('#mp').hidden){if(MP.screen==='entry'){mpHide();return true}return true}
  if(!$('#modal').hidden)return true;if(G){$('#confirm').hidden=false;return true}return false};

/* felt texture */
(function(){try{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=110+Math.random()*90;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);
  document.documentElement.style.setProperty('--noise',`url(${c.toDataURL()})`)}catch(e){}})();

applySettings();applyMpUi();geo();buildLobby();
