<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-vMcUnS+1607zTGIXwV4/cjsqe44+lFaltQd0wiLAfs4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">

</head><body>
<title>Taas Adda</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Figtree:wght@400;500;600;700&family=Mukta:wght@400;500;600;700&family=Libre+Caslon+Text:wght@700&display=swap">
<style>
/* Layout: a dim card lounge. One tilted oval table fills the screen; seats, pot and controls float around it. Single dark look by choice. */
:root{
  --room:#0d0a08; --lamp:#3b2a1b; --ink:#f2e8d4; --muted:#b7a98f; --gold:#dcb565; --gold-deep:#8f6a2a;
  --panel:rgba(20,15,11,.92); --line:rgba(242,232,212,.14); --danger:#c94a3f; --win:#6fbf8a;
  --red:#c21f30; --black:#18181d; --blue:#1d58b8; --green:#16803d; --paper:#fbf8f0; --paper2:#efe7d6;
  --f1:#21704a; --f2:#0b3923; --wood1:#5a3018; --wood2:#2a140a;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --ui:'Figtree','Mukta','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --idx:'Libre Caslon Text',Georgia,serif;
  --t:.42s;
  color-scheme:dark;
}
:root[data-felt=royal]{--f1:#24578f;--f2:#0b2442}
:root[data-felt=maroon]{--f1:#7c2433;--f2:#340a13}
:root[data-felt=midnight]{--f1:#30394a;--f2:#0f131a}
:root[data-felt=ocean]{--f1:#14707a;--f2:#06303a}
:root[data-felt=purple]{--f1:#5b3a8c;--f2:#1f1236}
:root[data-felt=festival]{--f1:#8f1d1d;--f2:#3b0707}
:root[data-felt=festival] .felt::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:.22;mix-blend-mode:screen;
  background:radial-gradient(circle at 50% 50%,transparent 0 21%,#f2b84b 21.3% 21.8%,transparent 22.1% 31%,#f2b84b 31.3% 31.7%,transparent 32%),
  repeating-conic-gradient(from 0deg at 50% 50%,#f2b84b 0 2deg,transparent 2deg 15deg)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;box-sizing:border-box;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 80% at 50% 28%,var(--lamp) 0%,#17110c 48%,var(--room) 100%);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden}

/* ---------- table ---------- */
#tablewrap{position:absolute;perspective:1100px;pointer-events:none}
#tablewrap::before{content:"";position:absolute;inset:14% 2% -6% 2%;border-radius:50%;background:rgba(0,0,0,.65);filter:blur(28px)}
#table{position:absolute;inset:0;border-radius:50%;transform:rotateX(34deg);transform-style:preserve-3d}
.rim{position:absolute;inset:0;border-radius:50%;transform-style:preserve-3d;
  background:repeating-radial-gradient(ellipse at 46% 40%,rgba(0,0,0,0) 0 7px,rgba(0,0,0,.09) 8px,rgba(0,0,0,0) 10px),
    radial-gradient(ellipse at 50% 22%,#9a6038 0%,var(--wood1) 42%,var(--wood2) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,220,170,.22),inset 0 -16px 30px rgba(0,0,0,.6),inset 0 12px 22px rgba(255,214,160,.22)}
.rim::before,.rim::after{content:"";position:absolute;inset:0;border-radius:50%}
.rim::before{background:linear-gradient(#3a1d0d,#1e0e05);transform:translateZ(-16px)}
.rim::after{background:#120803;transform:translateZ(-34px)}
.rail{position:absolute;inset:2.6%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 18%,#4a3426 0%,#24170f 45%,#120b07 100%);
  box-shadow:inset 0 3px 5px rgba(255,236,200,.18),inset 0 -8px 14px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.5)}
.rail::after{content:"";position:absolute;inset:3.2%;border-radius:50%;border:1px dashed rgba(230,196,140,.28)}
.trim{position:absolute;inset:5.7%;border-radius:50%;background:linear-gradient(170deg,#f2d690,#a77b33 45%,#6b4b1c 70%,#d9b468);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.felt{position:absolute;inset:6.2%;border-radius:50%;overflow:hidden;
  background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(255,236,190,.16),rgba(255,236,190,0) 70%),radial-gradient(ellipse at 50% 40%,var(--f1) 0%,var(--f2) 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.65),inset 0 6px 10px rgba(0,0,0,.7)}
.felt::before{content:"";position:absolute;inset:0;background-image:var(--noise);opacity:.55;mix-blend-mode:overlay}
.felt .ring{position:absolute;inset:17% 13%;border-radius:50%;border:2px solid rgba(220,181,101,.22)}
.felt .print{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:rgba(232,199,120,.2);font-family:var(--display);font-weight:700;letter-spacing:.32em;font-size:clamp(14px,3vw,30px);white-space:nowrap}
.felt .print small{display:block;font-family:var(--ui);font-size:.38em;letter-spacing:.5em;margin-top:.4em}

/* ---------- cards ---------- */
#cards,#seats,#fx,#labels{position:absolute;inset:0;pointer-events:none}
#labels{z-index:700}
#lamp{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 48% 40% at 50% 44%,rgba(255,214,150,.09),rgba(255,214,150,0) 70%),radial-gradient(ellipse 120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55));mix-blend-mode:normal}
:root.deva .glabel,:root.deva .seat .tag,:root.deva .feltnote,:root.deva .meta,:root.deva .field>label,:root.deva .field>span,:root.deva table.sc th,:root.deva .sheet .body h4{letter-spacing:0;text-transform:none}
:root.deva .ttl b,:root.deva .tile h2,:root.deva .sheet h3,:root.deva .atitle{font-family:'Mukta',var(--display);font-weight:700}
.glabel{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap;background:rgba(111,191,138,.92);color:#0d2416;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:1;transition:left .3s,top .3s}
.glabel.bad{background:rgba(242,232,212,.85);color:#3a2a1b}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);font-size:calc(var(--cw) / 5);perspective:calc(var(--cw) * 7);
  transition:transform var(--t) cubic-bezier(.22,.8,.24,1);pointer-events:auto}
.card .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform var(--t) cubic-bezier(.3,.7,.2,1),translate .16s ease}
.face{position:absolute;inset:0;border-radius:.42em;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:radial-gradient(ellipse at 28% 18%,#fffef9 0%,var(--paper) 45%,var(--paper2) 100%);color:var(--black);
  box-shadow:0 .025em 0 #ddd3bf,0 .05em 0 #c4b9a2,0 .1em .14em rgba(0,0,0,.38),0 .55em 1.1em rgba(0,0,0,.3),inset 0 0 0 1px rgba(0,0,0,.1)}
.front::before{content:"";position:absolute;inset:0;pointer-events:none;background:var(--noise);background-size:110px;opacity:.07;mix-blend-mode:multiply}
.front .gl{position:absolute;inset:0;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 70%,rgba(90,70,40,.08) 100%)}
.card.wild .front::after{content:"★";position:absolute;right:.16em;top:.2em;width:.95em;height:.95em;border-radius:50%;display:grid;place-items:center;font-size:.62em;color:#3a2606;background:radial-gradient(circle at 35% 30%,#ffe9a8,#c9982f);box-shadow:0 0 0 .05em #8a6420}
.back{transform:rotateY(180deg);box-shadow:0 .025em 0 #ddd3bf,0 .05em 0 #b8ad96,0 .1em .14em rgba(0,0,0,.4),0 .55em 1.1em rgba(0,0,0,.3)}
.back::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.22),rgba(255,255,255,0) 32%);pointer-events:none}
.s-H,.s-D{color:var(--red)}
#app.four .s-D{color:var(--blue)} #app.four .s-C{color:var(--green)}
.su{display:block;width:1em;height:1em;fill:currentColor;overflow:visible}
.idx{position:absolute;display:flex;flex-direction:column;align-items:center;width:1.3em;line-height:.86}
.idx b{font-family:var(--idx);font-weight:700;font-size:1.28em;letter-spacing:-.04em;white-space:nowrap}
.idx b.ten{letter-spacing:-.14em;margin-left:-.12em;transform:scaleX(.86)}
.idx .su{width:.86em;height:.86em;margin-top:.1em}
.idx.tl{left:.12em;top:.22em}
.idx.br{right:.12em;bottom:.22em;transform:rotate(180deg)}
#app.bigidx .idx{width:1.6em}
#app.bigidx .court{inset:9% 26%}
#app.bigidx .idx b{font-size:1.62em}
#app.bigidx .idx .su{width:1.05em;height:1.05em}
.pips{position:absolute;inset:11% 27%}
.pips .su{position:absolute;width:.96em;height:.96em;transform:translate(-50%,-50%)}
.pips .su.dn{transform:translate(-50%,-50%) rotate(180deg)}
#app.bigidx .pips{inset:12% 31%}
#app.bigidx .pips .su{width:1em;height:1em}
.ace{position:absolute;left:50%;top:50%;width:2.3em;height:2.3em;transform:translate(-50%,-50%)}
.ace .su{width:100%;height:100%;filter:drop-shadow(0 .03em .02em rgba(0,0,0,.18))}
.ace.big{width:3.1em;height:3.1em}
.ace.big::before{content:"";position:absolute;inset:-16%;border-radius:50%;border:.05em solid currentColor;opacity:.28;box-shadow:inset 0 0 0 .14em var(--paper),inset 0 0 0 .18em color-mix(in srgb,currentColor 30%,transparent)}
.ace .brand{position:absolute;left:50%;top:118%;transform:translateX(-50%);font:700 .24em/1 var(--ui);letter-spacing:.3em;white-space:nowrap;opacity:.7}
.court{position:absolute;inset:9% 22%;border-radius:.16em;overflow:hidden;display:grid;grid-template-rows:1fr 1fr;
  background:linear-gradient(180deg,#fff7e2,#f6e7c0);
  box-shadow:inset 0 0 0 .07em #b98f3e,inset 0 0 0 .15em #fff7e2,inset 0 0 0 .2em color-mix(in srgb,currentColor 55%,transparent)}
.court::before{content:"";position:absolute;inset:.2em;background:repeating-linear-gradient(135deg,color-mix(in srgb,currentColor 9%,transparent) 0 .1em,transparent .1em .26em);border-radius:.08em}
.court::after{content:"";position:absolute;left:.2em;right:.2em;top:50%;height:.06em;margin-top:-.03em;background:linear-gradient(90deg,transparent,#b98f3e 20%,#e6c47a 50%,#b98f3e 80%,transparent)}
.court .half{position:relative;display:grid;grid-template-columns:auto auto;align-items:center;justify-content:center;gap:.06em .12em;padding:.24em .1em 0}
.court .half.dn{transform:rotate(180deg)}
.court .ico{grid-column:1/3;width:1.8em;height:1em;justify-self:center}
symbol .a{fill:currentColor}symbol .g{fill:#d4a646;stroke:#8c6420;stroke-width:.6}
.court .cl{font-family:var(--display);font-weight:700;font-size:1.5em;line-height:.8;text-shadow:0 .04em 0 rgba(140,100,32,.35)}
.court .su{width:.78em;height:.78em}
/* backs */
.back{background:#8e1b2c}
.bk-crimson .back{background:
  radial-gradient(circle at 50% 50%,transparent 0 .9em,transparent .9em),
  repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 .08em,transparent .08em .42em),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.14) 0 .08em,transparent .08em .42em),
  linear-gradient(160deg,#b02639,#6c1020);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #7a1424,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-navy .back{background:
  radial-gradient(circle at 50% 50%,rgba(220,181,101,.5) 0 .08em,transparent .1em) 0 0/.5em .5em,
  linear-gradient(160deg,#21386b,#0e1a36);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #1a2c55,inset 0 0 0 .5em rgba(220,181,101,.35),0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-jade .back{background:
  conic-gradient(from 45deg,rgba(255,255,255,.1) 25%,transparent 0 50%,rgba(255,255,255,.1) 0 75%,transparent 0) 0 0/.6em .6em,
  linear-gradient(160deg,#1f7a5a,#0b3d2c);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #0d4a35,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-dhaka .back{background:
  linear-gradient(135deg,transparent 0 46%,#f1c232 46% 54%,transparent 54%) 0 0/.9em .9em,
  linear-gradient(45deg,transparent 0 40%,#111 40% 60%,transparent 60%) 0 0/.9em .9em,
  repeating-linear-gradient(90deg,#a11a22 0 .45em,#c8262e .45em .9em);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #6b0d14,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-mandala .back{background:
  radial-gradient(circle at 50% 50%,#e7c46f 0 .18em,transparent .2em),
  repeating-radial-gradient(circle at 50% 50%,rgba(231,196,111,.0) 0 .32em,rgba(231,196,111,.55) .33em .36em,rgba(231,196,111,0) .37em .6em),
  repeating-conic-gradient(from 0deg at 50% 50%,rgba(231,196,111,.22) 0 6deg,transparent 6deg 15deg),
  radial-gradient(circle at 50% 50%,#26306e,#111637);
  box-shadow:inset 0 0 0 .2em #f7efe0,inset 0 0 0 .28em #1a2052,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-gold .back{background:
  linear-gradient(45deg,transparent 0 47%,rgba(226,190,110,.75) 47% 53%,transparent 53%) 0 0/.7em .7em,
  linear-gradient(-45deg,transparent 0 47%,rgba(226,190,110,.75) 47% 53%,transparent 53%) 0 0/.7em .7em,
  linear-gradient(160deg,#1d1a16,#0a0907);
  box-shadow:inset 0 0 0 .2em #e8cf8f,inset 0 0 0 .28em #0a0907,inset 0 0 0 .34em rgba(226,190,110,.6),0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.bk-marigold .back{background:
  radial-gradient(circle at 50% 50%,#fff2c2 0 .12em,#ffb300 .13em .3em,#f57c00 .31em .42em,transparent .43em) 0 0/.95em .95em,
  radial-gradient(circle at 0 0,#ffb300 0 .12em,transparent .13em) 0 0/.95em .95em,
  linear-gradient(160deg,#c2410c,#7c2d12);
  box-shadow:inset 0 0 0 .2em #fff1d6,inset 0 0 0 .28em #7c2d12,0 .08em .12em rgba(0,0,0,.4),0 .5em 1em rgba(0,0,0,.3)}
.card.play{cursor:pointer}
@media (hover:hover){.card.play:hover .inner{translate:0 -9%}}
.card.dim .front{filter:brightness(.62) saturate(.7)}
.card.glow .face{box-shadow:0 0 0 .1em var(--gold),0 0 1.2em .2em rgba(220,181,101,.65)}
.card.hint .front{box-shadow:0 0 0 .12em #7ee0a1,0 0 1.3em .3em rgba(126,224,161,.75)}
.card.hint .inner{translate:0 -12%}
.card.sel .front{box-shadow:0 0 0 .12em var(--gold),0 .6em 1.2em rgba(0,0,0,.4)}
.card.flat .face{box-shadow:none}
.card.static{position:relative;display:inline-block;transition:none}

/* ---------- seats ---------- */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;
  background:linear-gradient(180deg,rgba(32,24,18,.94),rgba(16,12,9,.94));border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45);
  transition:left .3s,top .3s,box-shadow .3s,border-color .3s;z-index:1000;max-width:170px;white-space:nowrap}
.seat .av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#1a120b;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--av) 60%,#fff),var(--av));box-shadow:inset 0 -2px 4px rgba(0,0,0,.3),0 0 0 2px #1a120b,0 0 0 3.5px rgba(220,181,101,.55)}
.seat .who{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.seat .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.seat .sub{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.seat .tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);padding:2px 7px;border-radius:999px;background:rgba(220,181,101,.12);font-variant-numeric:tabular-nums}
.seat .tag:empty{display:none}
.seat .dl{position:absolute;right:-4px;top:-4px;width:16px;height:16px;border-radius:50%;background:#f2e8d4;color:#1a120b;font-size:9.5px;font-weight:800;display:none;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.seat.dealer .dl{display:grid}
.seat.turn{border-color:var(--gold);box-shadow:0 0 0 2px rgba(220,181,101,.35),0 0 22px rgba(220,181,101,.35)}
.seat .av{position:relative}.seat .av.emo{font-size:20px;line-height:1}
.seat.turn .av::after{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),rgba(220,181,101,0) 70%);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);animation:spin 1.1s linear infinite}
.seat.out{opacity:.55}
.seat.winner{border-color:var(--win);box-shadow:0 0 0 2px rgba(111,191,138,.4),0 0 24px rgba(111,191,138,.45)}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(220,181,101,.35)}}
.bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px) scale(.9);opacity:0;background:var(--paper);color:#1a120b;font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:10px;white-space:nowrap;transition:opacity .2s,transform .2s;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--paper)}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.seat.low .bubble{bottom:auto;top:calc(100% + 8px)}
.seat.low .bubble::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--paper)}

/* ---------- center / chips ---------- */
#center{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:150;text-align:center}
.pot{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(calc(var(--ch) * .55))}
.pot b{font-size:18px;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.pot span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(242,232,212,.7)}
.stack{position:relative;height:30px;width:60px}
.chip{position:absolute;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18) 0 30%,var(--cc) 31% 52%,transparent 53%),repeating-conic-gradient(#f6eedc 0 14deg,var(--cc) 14deg 45deg);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 1px 0 color-mix(in srgb,var(--cc) 55%,#000),0 2px 0 #e9dfca,0 3px 0 color-mix(in srgb,var(--cc) 55%,#000),0 5px 6px rgba(0,0,0,.45)}
.stack .chip{transform:scaleY(.6)}
.stack{display:flex;gap:4px;align-items:flex-end;justify-content:center;width:auto!important;height:46px!important}
.stack .col{position:relative;width:26px;height:46px}
.flychip{position:absolute;left:0;top:0;z-index:1200;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .2s .5s}
.trumpb{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(242,232,212,.8)}
.trumpb b{font-size:34px;line-height:1;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(251,248,240,.9);box-shadow:0 4px 12px rgba(0,0,0,.45),inset 0 0 0 3px rgba(220,181,101,.6)}
.trumpb.s-S b,.trumpb.s-C b{color:var(--black)}.trumpb.s-H b,.trumpb.s-D b{color:var(--red)}
.trumpb span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(242,232,212,.7)}

.ach.got{opacity:1;border-color:rgba(220,181,101,.5);background:rgba(220,181,101,.08)}
.ach .ai{font-size:20px}.ach b{font-size:13.5px}.ach small{font-size:11.5px;color:var(--muted);line-height:1.35}
.ach .ac{font-size:12px;color:var(--gold);font-weight:700;display:flex;gap:4px;align-items:center;margin-top:auto}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.sitem{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:center}
.sitem.using{border-color:var(--gold)}
.sitem b{font-size:13.5px}.sitem .btn{width:100%;flex-direction:row;justify-content:center;gap:6px;padding:7px 10px;min-width:0}
.stag{font-size:10.5px;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.sfelt{width:78px;height:50px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,var(--sw),color-mix(in srgb,var(--sw) 35%,#000));box-shadow:0 0 0 5px #4a2a16,0 0 0 6px #d4a646,0 6px 14px rgba(0,0,0,.5)}
.sback{height:66px;display:grid;place-items:center}
.sback .card.static{position:relative}
.sheet .body h4{margin:16px 0 8px}
.freec{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid rgba(220,181,101,.45);background:rgba(220,181,101,.08);margin-bottom:6px}.freec .fci{font-size:24px}.freec .fct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.freec small{color:var(--muted);font-size:12px}.freec .btn{min-width:0}
.guide{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5}.guide li::marker{color:var(--gold);font-weight:700}
@media (max-width:560px){.pinfo{display:none}.pchip{padding:3px}.drow{gap:4px}.dday b{font-size:13px}.pstats b{font-size:15px}}
@media (max-width:440px){#bSound{display:none}#top{gap:7px}}
@media (max-width:560px){
  .seat{padding:4px 9px 4px 4px;gap:6px;max-width:132px}
  .seat .av{width:28px;height:28px;font-size:13px}
  .seat .nm{font-size:12px}.seat .sub{font-size:10.5px}
  .seat .tag{display:none}
  .ttl b{font-size:19px}
  .btn{padding:8px 11px;min-width:62px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){:root{--t:.12s!important}.seat.turn .av,.seat.turn .av::after{animation:none}}

'Draw, discard and build sequences and sets with a cut joker. Needs a pure sequence to declare.':['पत्ती तान्नुहोस्, फाल्नुहोस् र कट जोकरसँग सिक्वेन्स र सेट बनाउनुहोस्। डिक्लेयर गर्न प्योर सिक्वेन्स चाहिन्छ।','पत्ता उठाएँ, फेंकें और कट जोकर के साथ सीक्वेंस और सेट बनाएँ। डिक्लेयर के लिए प्योर सीक्वेंस ज़रूरी है।'],
'Shed pairs, sets and runs to bring your hand total down, then call Show.':['जोडी, सेट र रन फालेर हातको जम्मा अंक घटाउनुहोस्, अनि शो भन्नुहोस्।','जोड़े, सेट और रन फेंककर हाथ का कुल अंक घटाएँ, फिर शो बोलें।'],

'Hands are compared one by one: 1st, then 2nd, then 3rd.':['हातहरू एक-एक गरी दाँजिन्छन्: पहिलो, दोस्रो, अनि तेस्रो।','हाथ एक-एक करके मिलाए जाते हैं: पहला, फिर दूसरा, फिर तीसरा।'],
'Win two shows to take the pot. If nobody does, it’s Kitti: the pot carries over.':['दुई शो जिते पट तपाईंको। कसैले जितेन भने किट्टी: पट अर्को डिलमा सर्छ।','दो शो जीतें तो पॉट आपका। कोई न जीते तो किट्टी: पॉट अगली डील में जाता है।'],
'Everyone gets 21 cards. Each turn, draw a card and then throw one.':['सबैले 21 पत्ती पाउँछन्। हरेक पालोमा एउटा तान्नुहोस् र एउटा फाल्नुहोस्।','सबको 21 पत्ते मिलते हैं। हर बारी में एक उठाएँ और एक फेंकें।'],
'Make three pure sequences or tunnelas, then tap Show to see the maal.':['तीन प्योर सिक्वेन्स वा टुन्नेला बनाएर माल हेर्न शो थिच्नुहोस्।','तीन प्योर सीक्वेंस या टुन्नेला बनाकर माल देखने के लिए शो दबाएँ।'],
'After seeing, maal cards are jokers and score points: tiplu, poplu, jhiplu, alter.':['माल हेरेपछि मालका पत्ती जोकर हुन्छन् र अंक दिन्छन्: टिप्लु, पोप्लु, झिप्लु, अल्टर।','माल देखने के बाद माल के पत्ते जोकर बनते हैं और अंक देते हैं: टिप्लू, पोप्लू, झिप्लू, अल्टर।'],
'Finish when every card is in a group, or collect seven dublees instead.':['सबै पत्ती समूहमा मिलेपछि गेम गर्नुहोस्, वा सात डब्लीको बाटो रोज्नुहोस्।','सब पत्ते समूह में हों तो गेम करें, या सात डबली का रास्ता चुनें।'],
'Each player gets 13 cards. A cut card makes every card of its rank a joker.':['हरेकले 13 पत्ती पाउँछ। काटिएको पत्तीको अंकका सबै पत्ती जोकर हुन्छन्।','हर खिलाड़ी को 13 पत्ते मिलते हैं। कटे पत्ते के अंक वाले सब पत्ते जोकर बनते हैं।'],
'Draw from the closed deck or the open pile, then discard one card.':['बन्द गड्डी वा खुला थुप्रोबाट तानेर एउटा पत्ती फाल्नुहोस्।','बंद गड्डी या खुले ढेर से उठाकर एक पत्ता फेंकें।'],
'Build sequences and sets. You need at least one pure sequence.':['सिक्वेन्स र सेट बनाउनुहोस्। कम्तीमा एउटा प्योर सिक्वेन्स चाहिन्छ।','सीक्वेंस और सेट बनाएँ। कम से कम एक प्योर सीक्वेंस ज़रूरी है।'],
'When all 13 cards are grouped, discard your last card and Declare.':['13 वटै पत्ती मिलेपछि अन्तिम पत्ती फालेर डिक्लेयर गर्नुहोस्।','सभी 13 पत्ते जम जाएँ तो आख़िरी पत्ता फेंककर डिक्लेयर करें।'],
'You get 5 cards. You want the lowest total: A = 1, K = 13.':['तपाईंले 5 पत्ती पाउनुहुन्छ। सबैभन्दा कम जम्मा चाहिन्छ: A = 1, K = 13।','आपको 5 पत्ते मिलते हैं। सबसे कम कुल चाहिए: A = 1, K = 13।'],
'Discard one card, a set of one rank, or a run of 3 or more in one suit.':['एउटा पत्ती, एकै अंकको सेट, वा एकै रङको 3 वा बढीको रन फाल्नुहोस्।','एक पत्ता, एक ही अंक का सेट, या एक रंग के 3 या ज़्यादा का रन फेंकें।'],
'Then pick up from the deck or from the last discard.':['त्यसपछि गड्डी वा पछिल्लो फालिएकोबाट उठाउनुहोस्।','फिर गड्डी से या आख़िरी फेंके पत्तों से उठाएँ।'],
'When your total is low enough, call Show. You must be the lowest!':['जम्मा पर्याप्त कम भएपछि शो भन्नुहोस्। तपाईं सबैभन्दा कम हुनैपर्छ!','कुल काफ़ी कम हो तो शो बोलें। आपका सबसे कम होना ज़रूरी है!'],

function tone(a,f,t0,dur,type,vol){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+dur+.02)}
function sfx(k){const a=ac();if(!a)return;const t=a.currentTime;
  if(k==='card'||k==='sweep'){const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NOISE;f.type='bandpass';f.frequency.value=k==='card'?2600:1400;f.Q.value=.9;const d=k==='card'?.07:.22;g.gain.setValueAtTime(k==='card'?.32:.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t);s.stop(t+d+.02)}
  else if(k==='shuffle'){for(let j=0;j<7;j++){const s2=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s2.buffer=NOISE;f.type='bandpass';f.frequency.value=2200+j*120;g.gain.setValueAtTime(.0001,t+j*.045);g.gain.linearRampToValueAtTime(.14,t+j*.045+.01);g.gain.exponentialRampToValueAtTime(.001,t+j*.045+.06);s2.connect(f).connect(g).connect(a.destination);s2.start(t+j*.045);s2.stop(t+j*.045+.08)}}
  else if(k==='chip'){tone(a,2900,t,.07,'sine',.12);tone(a,3600,t+.03,.08,'sine',.08)}
  else if(k==='tick'){tone(a,880,t,.06,'triangle',.12)}
  else if(k==='fold'){tone(a,220,t,.14,'triangle',.12)}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(a,f,t+i*.09,.35,'triangle',.13))}
  else if(k==='lose'){[392,330,262].forEach((f,i)=>tone(a,f,t+i*.12,.3,'triangle',.11))}
}

const su=(s,cls,st)=>`<svg class="su${cls?' '+cls:''}"${st?` style="${st}"`:''} viewBox="0 0 100 100" aria-hidden="true"><use href="#su-${s}"/></svg>`;

  if(c.r<=10)mid='<div class="pips">'+PIPS[c.r].map(([x,yy])=>su(c.s,yy>50?'dn':'',`left:${x}%;top:${yy}%`)).join('')+'</div>';

/* ================= geometry ================= */
let W=0,H=0,CW=60,CH=84,cx=0,cy=0,rx=0,ry=0,PORTRAIT=false;
function geo(){
  W=app.clientWidth;H=app.clientHeight;PORTRAIT=H>W*1.1;
  CW=Math.round(clamp(Math.min(W/(PORTRAIT?6.8:10.5),H/(PORTRAIT?8.4:5.9)),40,96));CH=Math.round(CW*1.4);
  cx=W/2;cy=H*(PORTRAIT?.44:.45);rx=W*(PORTRAIT?.37:.4);ry=H*(PORTRAIT?.27:.31);
  app.style.setProperty('--cw',CW+'px');app.style.setProperty('--ch',CH+'px');app.style.setProperty('--actb',(CH*1.12+(W<560?70:12)+((G&&G.actbExtra)||0))+'px');
  const tw=$('#tablewrap'),w=rx*2.18,h=ry*2.5;
  Object.assign(tw.style,{width:w+'px',height:h+'px',left:(cx-w/2)+'px',top:(cy-h/2+ry*.08)+'px'});
}
const seatAng=(i,n)=>(90-i*360/n)*Math.PI/180; // play passes to the right (anticlockwise), as in Nepal and India
const seatPt=(i,n)=>{const a=seatAng(i,n);return{x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)}};
const handY=()=>H-CH*.56-4;
const lerp=(p,q,k)=>({x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k});
function humanFan(cards,L,o={}){
  const n=cards.length;if(!n)return 0;const s=o.s||1;
  const maxW=Math.min(W-12,n*CW*s*.7+CW*s*.3);
  const sp=n>1?Math.min(CW*s*.7,(maxW-CW*s)/(n-1)):0;const y0=handY()-(s-1)*CH*.5;
  cards.forEach((c,k)=>{const off=k-(n-1)/2;let y=y0+off*off*CW*.011;if(o.sel&&o.sel.has(c.id))y-=CH*.22;
    const legal=o.legal?o.legal.has(c.id):!!o.click;
    L.push({c,x:cx+off*sp,y,r:off*(n>6?1.4:3),t:-9,up:o.up!==false,s,z:600+k,click:legal,dim:(o.legal&&!legal)||o.dim,sel:o.sel&&o.sel.has(c.id)})});
  return sp*(n-1)+CW*s;
}
function oppFan(i,n,cards,L,o={}){
  const a=seatAng(i,n),sp=seatPt(i,n),k=o.k??(PORTRAIT?.34:.3);
  const b=lerp(sp,{x:cx,y:cy},k);const tx=-Math.sin(a),ty=Math.cos(a);const s=o.s??.5,gap=o.gap??CW*.13,m=cards.length;
  cards.forEach((c,j)=>{const off=j-(m-1)/2;L.push({c,x:b.x+tx*off*gap,y:b.y+ty*off*gap,r:a*180/Math.PI-90+off*(o.up?2:3),t:o.t??22,up:!!o.up,s,z:(o.z??200)+j,dim:o.dim,glow:o.glow,click:o.click})});
}
function badgePos(i){
  const n=G.players.length;
  if(i===0){const span=G.handSpan||CW*3;const left=cx-span/2;
    if(left>(W<560?150:200))return{x:left-(W<560?72:96),y:handY()+CH*.05,low:false};
    return{x:W<560?70:96,y:handY()-CH*.62-(W<560?30:24)-(G.actbExtra||0),low:false}}
  const a=seatAng(i,n),sp=seatPt(i,n);let x=sp.x+(sp.x-cx)*.1,y=sp.y+(sp.y-cy)*.14;
  if(PORTRAIT&&Math.abs(Math.cos(a))>.6)y-=CH*1.0;
  x=clamp(x,W<560?64:96,W-(W<560?64:96));y=clamp(y,84,H-CH*1.4-60);
  return{x,y,low:y<140}
}

function setTf(el,p){el.style.transform=`translate3d(${p.x-CW/2}px,${p.y-CH/2}px,0) rotate(${p.r||0}deg) scale(${p.s||1})`;el.firstChild.style.transform=`rotateX(${p.t||0}deg) rotateY(${p.up?0:180}deg)`}

  if(!G)return;const L=G.placements(),used=new Set(),dp=G.deckPos();
  for(const p of L){const el=cardEl(p.c);used.add(p.c.id);
    if(el.hidden){el.hidden=false;el.style.transition='none';el.firstChild.style.transition='none';const f=p.from||dp;setTf(el,{x:f.x,y:f.y,s:p.s||1,t:26,up:false});void el.offsetWidth;el.style.transition='';el.firstChild.style.transition=''}

/* =========================================================
   CALL BREAK
   ========================================================= */
class CallBreak{
  constructor(o){this.key='callbreak';this.title='Call Break';this.rounds=o.rounds||5;this.deck=newDeck();
    this.players=makePlayers(4).map(p=>Object.assign(p,{hand:[],won:[],bid:0,tricks:0,scores:[]}));
    if(o.seats)o.seats.forEach((st,i)=>{if(st&&st.id&&i>0)Object.assign(this.players[i],{name:st.name,bot:false,remote:st.id,color:AVC[(i+2)%AVC.length]})});
    this.dealer=rand(4);this.pile=[];this.trick=[];this.played=new Set();this.round=0;this.cur=-1;this.phase='';this.legalSet=null;this.glowId=null}
  rAsk(i,q){const p=this.players[i];if(!p.remote)return Promise.resolve('__bot');return new Promise(res=>{MP.asks[i]=res;MP.net.send(p.remote,{t:'ask',q})})}
  viewFor(s){return{round:this.round,rounds:this.rounds,dealer:this.dealer,cur:this.cur,phase:this.phase,glow:this.glowId,pile:this.pile.length,
    players:this.players.map(p=>({name:p.name,color:p.color,bid:p.bid,tricks:p.tricks,scores:p.scores,hc:p.hand.length,won:p.won.map(c=>c.id)})),
    hand:this.players[s].hand.map(c=>c.id),trick:this.trick.map(t=>({p:t.p,id:t.c.id}))}}
  print(){return['CALL BREAK','SPADES ARE TRUMP']}
  subtitle(){return`Round ${this.round} of ${this.rounds}`}
  deckPos(){return{x:cx,y:cy}}
  total(p){return Math.round(p.scores.reduce((a,b)=>a+b,0)*10)/10}
  seatInfo(i){const p=this.players[i];const sub=this.phase==='bid'&&!p.bid?'Bidding…':p.bid?`Bid ${p.bid} · Won ${p.tricks}`:'';return{sub,tag:this.total(p).toFixed(1)}}
  centerHTML(){return''}
  placements(){const L=[];
    this.pile.forEach((c,k)=>L.push({c,x:cx+k*.18,y:cy-k*.32,t:26,up:false,z:k+1,s:.9,flat:k>0}));
    this.handSpan=humanFan(this.players[0].hand,L,{legal:this.legalSet});
    for(let i=1;i<4;i++)oppFan(i,4,this.players[i].hand,L);
    this.trick.forEach((tc,k)=>{const sp=seatPt(tc.p,4);L.push({c:tc.c,x:cx+(sp.x-cx)*.27,y:cy+(sp.y-cy)*.3,r:jit(tc.c.id,14),t:22,up:true,z:300+k,s:.86,glow:this.glowId===tc.c.id})});
    this.players.forEach((p,i)=>{const sp=seatPt(i,4),a=seatAng(i,4);const q=i===0?{x:cx+CW*2.1,y:cy+ry*.62}:lerp({x:sp.x-Math.sin(a)*CW*1.1,y:sp.y+Math.cos(a)*CW*1.1},{x:cx,y:cy},.12);
      p.won.forEach((c,k)=>L.push({c,x:q.x+(Math.floor(k/4))*.8,y:q.y-Math.floor(k/4)*1.4,r:jit(c.id,30)+(k%4)*4,t:26,up:false,s:.42,z:100+k}))});
    return L}
  sortHand(h){const o={S:0,H:1,C:2,D:3};h.sort((a,b)=>o[a.s]-o[b.s]||b.r-a.r)}
  async run(){
    for(this.round=1;this.round<=this.rounds;this.round++){
      await this.deal();await this.bidding();this.leader=(this.dealer+1)%4;
      for(let t=0;t<13;t++)await this.playTrick();
      this.players.forEach(p=>p.scores.push(p.tricks>=p.bid?Math.round((p.bid+(p.tricks-p.bid)/10)*10)/10:-p.bid));
      {const me=this.players[0];if(me.tricks>=me.bid){track('cb_made');if(me.bid>=8)track('cb_bid8')}}
      render();const r=await this.scoreboard(this.round===this.rounds);if(r)return r;
      this.dealer=(this.dealer+1)%4}
  }
  async deal(){
    this.players.forEach(p=>{p.hand=[];p.won=[];p.bid=0;p.tricks=0});this.trick=[];this.played.clear();this.phase='deal';
    hideAll();this.pile=shuffle(this.deck.slice());render();msg('Dealing…');await sleep(450);
    for(let k=0;k<52;k++){this.players[(this.dealer+1+k)%4].hand.push(this.pile.pop());if(k%2===0)sfx('card');render();await sleep(24)}
    this.sortHand(this.players[0].hand);msg('');render();await sleep(350)}
  estimate(h){
    const by={S:[],H:[],C:[],D:[]};h.forEach(c=>by[c.s].push(c.r));const sp=by.S.length;let b=0;
    for(const s of SUITS){const a=by[s].sort((x,y)=>y-x),n=a.length;
      if(s==='S'){for(const r of a){if(r===14)b+=1;else if(r===13)b+=n>=2?1:.55;else if(r===12)b+=n>=3?.75:.25;else if(r===11)b+=n>=4?.45:0}if(n>3)b+=(n-3)*.75}
      else{if(a.includes(14))b+=n<=5?1:.75;if(a.includes(13))b+=n>=2&&n<=5?.75:n===1?.15:.4;if(a.includes(12)&&n>=3&&n<=4)b+=.3;
        if(n===0&&sp>=2)b+=.65;else if(n===1&&sp>=3)b+=.3}}
    const d=S.diff;if(d==='easy')b+=Math.random()*1.4-.7;
    return clamp(Math.floor(b+(d==='hard'?.35:.2)),1,8)}
  async bidding(){this.phase='bid';

   KITTI — nine cards, three shows, Flash ranks
   ========================================================= */
const ORD=['1st','2nd','3rd'];

    if(open){c=this.open.pop();this.taken=c.id}else{if(!this.pile.length){const top=this.open.pop();this.pile=shuffle(this.open);this.open=[top];msg('Closed deck reshuffled')}c=this.pile.pop();this.taken=null}
    p.hand.push(c);sfx('card');if(i)bubble(i,open?`Takes ${ctxt(c)}`:'Draws',900);render();return c}
  discard(i,c){const p=this.players[i];p.hand.splice(p.hand.indexOf(c),1);this.open.push(c);sfx('card');if(i)bubble(i,`Discards ${ctxt(c)}`,900);render()}
  bestDiscard(h,ban){let b=null;for(const c of h){if(c.id===ban)continue;const sc=this.arr(h.filter(x=>x!==c)).score,tb=-rPts(c,this.wildR)+(c.r===this.wildR?50:0);if(!b||sc<b.score||(sc===b.score&&tb<b.tb))b={card:c,score:sc,tb}}return b}
  async botTurn(i,first){const p=this.players[i],d=S.diff;await sleep(650);
    const base=this.arr(p.hand).score;
    if(first&&base>=(d==='hard'?55:65)&&Math.random()<.55)return{drop:true};
    const top=this.open[this.open.length-1];let take=false;
    if(top){if(top.r===this.wildR)take=true;else{const b=this.bestDiscard(p.hand.concat([top]),top.id);take=b.score<base-(d==='easy'?5:1)}}
    if(d==='easy'&&Math.random()<.2)take=false;
    this.draw(i,take);await sleep(520);
    const b=this.bestDiscard(p.hand,this.taken);let c=b.card;
    if(d==='easy'&&b.score>0&&Math.random()<.2){const pool=p.hand.filter(x=>x.id!==this.taken&&x.r!==this.wildR);if(pool.length)c=pool[rand(pool.length)]}
    this.discard(i,c);return b.score===0&&c===b.card?{declare:true}:null}
  onCard(id){
    if(this.phase==='draw'){const tp=this.pile[this.pile.length-1],to=this.open[this.open.length-1];if(this.pile.some(c=>c.id===id))resolveHuman('closed');else if(to&&to.id===id)resolveHuman('open')}
    else if(this.phase==='discard'&&this.players[0].hand.some(c=>c.id===id))resolveHuman({card:id})}
  async humanTurn(first){const p=this.players[0];this.phase='draw';
    setActions([{label:'Drop',sub:`${first?20:40} points`,value:'drop',kind:'danger'}]);msg('Draw from the closed deck, or take the open card');render();
    let v=await waitHuman();setActions([]);this.phase='';
    if(v==='drop'){msg('');return{drop:true}}
    this.draw(0,v==='open');this.phase='discard';this.sel=null;
    const canFinish=()=>p.hand.some(c=>c.id!==this.taken&&this.arr(p.hand.filter(x=>x!==c)).score===0);
    for(;;){const sc=p.hand.find(c=>c.id===this.sel),blocked=sc&&sc.id===this.taken;const decl=sc&&!blocked&&this.arr(p.hand.filter(x=>x!==sc)).score===0;
      setActions([{label:'Discard',value:'discard',disabled:!sc||blocked,kind:decl?'':'primary'},{label:'Declare',value:'declare',disabled:!decl,kind:decl?'primary':''}]);
      msg(!sc?(canFinish()?'You can finish! Pick the card to discard and Declare':'Tap a card to discard'):blocked?'You can’t discard the card you just picked up':decl?'Ready: Declare to win this deal':'Discard this card, or tap another');render();
      v=await waitHuman();
      if(v&&v.card){this.sel=this.sel===v.card?null:v.card;sfx('tick');continue}
      if((v==='discard'||v==='declare')&&sc&&!blocked){setActions([]);msg('');this.phase='';this.sel=null;this.discard(0,sc);return v==='declare'&&decl?{declare:true}:null}}}
  async results(final){
    const w=this.winner;this.reveal=true;this.winIdx=w;
    const add=this.players.map((p,j)=>j===w?0:p.dropped?p.dropped:this.pts(p));
    this.players.forEach((p,j)=>p.scores.push(add[j]));render();sfx(w===0?'win':'tick');if(w===0)track('rm_declare');await sleep(1300);
    const tots=this.players.map(p=>this.total(p)),minT=Math.min(...tots);
    const rows=this.players.map((p,j)=>`<tr><td>${esc(p.name)}${j===w?' · declared':p.dropped?' · dropped':''}</td><td>${j===w?'Valid show':p.dropped?'—':this.arr(p.hand).score+' in hand'}</td><td class="${add[j]?'neg':'best'}">+${add[j]}</td><td>${final&&tots[j]===minT?`<span class="best">${tots[j]}</span>`:tots[j]}</td></tr>`).join('');
    const tbl=`<div class="tbl"><table class="sc"><tr><th>Player</th><th>Hand</th><th>Points</th><th>Total</th></tr>${rows}</table></div>`;
    const head=w<0?'Deal abandoned':w===0?'You declared!':`${esc(this.players[w].name)} declared`;
    const note=`<p>Losers add their unmatched points (capped at 80). A drop costs 20 before your first draw, 40 after.</p>`;
    if(!final){await modal({title:head,body:note+tbl,buttons:[{label:'Next deal',value:1,primary:true}],wide:true});this.winIdx=-1;return null}
    const winners=this.players.filter((p,j)=>tots[j]===minT),me=winners.includes(this.players[0]);stat(this.key,me);sfx(me?'win':'lose');
    return await modal({title:me?'You win the game!':`${esc(winners[0].name)} wins the game`,body:note+tbl,buttons:[{label:'Lobby',value:'lobby'},{label:'Play again',value:'again',primary:true}],wide:true})}
}

const RULES={
 callbreak:`<h4>Setup</h4><p>Four players, one 52-card deck, 13 cards each. Dealing and play pass to the right (anticlockwise). The player to the dealer’s right bids first and leads the first trick. Spades are always trump.</p>
 <h4>Bidding</h4><p>Each player bids how many tricks they expect to win, at least 1. This table allows bids from 1 to 8.</p>
 <h4>Playing a trick</h4><ul><li>You must follow the suit that was led, and you must play higher than the best card of that suit in the trick if you can.</li><li>If you have none of the led suit, you must play a spade. If a spade is already in the trick, you must beat it if you can; if you can’t, you may play any card.</li><li>If you have neither the led suit nor spades, play any card.</li><li>The highest spade wins the trick; if no spade was played, the highest card of the led suit wins. The winner leads next.</li></ul>
 <h4>Scoring</h4><p>Make your bid: score the bid, plus 0.1 for each extra trick (bid 3, win 5 = 3.2). Miss it: score minus your bid (−3). After the last round, the highest total wins.</p>`,
 teenpatti:`<h4>Hand ranks, high to low</h4><ul><li><b>Trail</b>: three of a kind. A-A-A is highest.</li><li><b>Pure sequence</b>: three in a row of one suit.</li><li><b>Sequence</b>: three in a row, mixed suits. A-K-Q is highest, then A-2-3, then K-Q-J.</li><li><b>Color</b>: three cards of one suit.</li><li><b>Pair</b>: two of a kind.</li><li><b>High card</b>: none of the above.</li></ul><p>Within a rank, higher cards win. Suits never break ties.</p>
 <h4>Betting</h4><ul><li>Everyone puts the boot in the pot and gets three cards face down. Play passes to the right.</li><li>A <b>blind</b> player bets the current stake without looking. A <b>seen</b> player bets twice the stake (Chaal).</li><li><b>Raise</b> doubles the stake. <b>Pack</b> folds your hand.</li><li><b>Sideshow</b>: if you and the player before you have both seen your cards, you can ask to compare privately. They may refuse. If they accept, the weaker hand packs; on a tie the asker packs.</li><li><b>Show</b> is only possible when two players remain. A seen player cannot ask a blind player for a show. On a tie, the player who asked loses.</li><li>When the pot reaches the pot limit, all remaining hands are shown and the best one wins.</li></ul>
 <h4>Variants</h4><p><b>Joker wild</b>: one card is turned up; every card of that rank is wild. <b>Muflis</b>: the order is reversed and the lowest hand wins.</p>`,
 dhumbal:`<h4>Card values</h4><p>A = 1, 2 to 10 at face value, J = 11, Q = 12, K = 13. You want the lowest total.</p>
 <h4>Your turn</h4><ul><li>Each player has 5 cards. Play passes to the right.</li><li>First <b>discard</b>: one card, or 2 to 4 cards of the same rank, or a run of 3 or more in one suit (A-2-3 counts; Q-K-A does not).</li><li>Then <b>pick up one card</b>: the top of the deck, or any one card the previous player just discarded.</li></ul>
 <h4>Show</h4><p>At the start of your turn, if your hand totals the show limit or less, you can call Show instead of discarding.</p><ul><li>If your total is strictly the lowest, you score 0 and everyone else adds their hand total.</li><li>If anyone ties or beats you, you add your total plus a 25-point penalty, the lowest hand scores 0, and the rest add their totals.</li></ul>
 <p>When someone reaches the end score, the lowest score wins. Dhumbal is a home game and groups vary the show limit and penalty, so you can change the limit when you start.</p>`,
 rummy:`<h4>Setup</h4><p>Two 52-card decks. Each player gets 13 cards. One card is cut and placed under the closed deck: every card of that rank, in any suit, is a <b>joker</b> for this deal (marked with a gold star). Printed jokers are not used here.</p>
 <h4>Your turn</h4><ul><li>Draw one card, from the closed deck or the top of the open pile.</li><li>Discard one card to the open pile. You can’t discard the card you just took from the open pile.</li></ul>
 <h4>Groups</h4><ul><li><b>Pure sequence</b>: 3 or more cards in a row of one suit, with no joker standing in for a missing card. A can be low (A-2-3) or high (Q-K-A), but not K-A-2.</li><li><b>Sequence</b>: the same, with jokers filling gaps.</li><li><b>Set</b>: 3 or 4 cards of the same rank in different suits, jokers allowed.</li></ul>
 <h4>Declaring</h4><p>When all 13 cards (after your discard) form groups, with at least two sequences and at least one of them pure, you can Declare. Your hand is arranged automatically into its best groups.</p>
 <h4>Scoring</h4><ul><li>A, K, Q, J and 10 count 10; other cards count face value; jokers count 0.</li><li>Without a pure sequence, every card counts. With a pure sequence but no second sequence, everything except the pure sequence counts. Otherwise only unmatched cards count. A hand scores at most 80.</li><li><b>Drop</b>: give up the deal for 20 points before your first draw, or 40 later.</li><li>The declarer scores 0. After the last deal, the lowest total wins.</li></ul>`
};
RULES.kachuful=`<h4>Rounds</h4><p>Each round deals one card fewer than the last (for example 8, 7 … 1). Trump rotates in the order that gives the game its name: <b>Ka</b>ali ♠, <b>Chu</b>kat ♦, <b>Phu</b>li ♣, <b>L</b>aal ♥. Play passes to the right.</p>
 <h4>Calling</h4><p>Starting to the dealer’s right, everyone calls exactly how many tricks they will win. Zero is allowed. The dealer calls last and may not call the number that makes the total equal to the cards in hand, so somebody always misses.</p>
 <h4>Play</h4><ul><li>Follow the suit led if you can. If you can’t, play any card, trump or not.</li><li>The highest trump wins; if there is none, the highest card of the led suit wins. The winner leads next.</li></ul>
 <h4>Scoring</h4><p>Take exactly your call: score 10 plus the call (call 2, take 2 = 12; call 0, take 0 = 10). Take more or fewer: score 0. Highest total after the last round wins. Some groups score calls differently; this is the most common way.</p>`;
RULES.kitti=`<h4>Setup</h4><p>Everyone puts the boot in the pot and gets 9 cards. Split them into three hands of three: your 1st, 2nd and 3rd hand. Your best split is set for you; tap two cards to swap them, or tap Auto arrange.</p>
 <h4>Hand ranks (Flash)</h4><p>Trial (three of a kind) › Double run (pure sequence) › Run › Color › Jute (pair) › Top (high card). A-K-Q is the highest run, then A-2-3.</p>
 <h4>Shows</h4><ul><li>All 1st hands are shown and compared; the best wins the 1st show. Then the 2nd hands, then the 3rd.</li><li>If the best hands tie exactly, nobody wins that show.</li><li>Win two shows and you take the pot.</li><li>If nobody wins two shows it is <b>Kitti</b>: the pot stays on the table and is added to the next deal.</li></ul>
 <p>Groups differ on details, such as requiring the 1st hand to be the strongest. Here you may order your hands any way you like.</p>`;
RULES.marriage=`<h4>Setup</h4><p>Three decks shuffled together. Each player gets 21 cards. One card is set aside face down: the <b>maal</b>. One card starts the discard pile. Play passes to the right.</p>
 <h4>Your turn</h4><ul><li>Draw from the deck, or take the top discard. You may only take the discard if it completes a group with two cards in your hand (or a dublee, if you are collecting dublees).</li><li>Then throw one card. You can’t throw back the card you just took.</li></ul>
 <h4>Seeing the maal</h4><p>Lay down three groups of three: <b>pure sequences</b> (three in a row, one suit, A-2-3 and Q-K-A allowed) or <b>tunnelas</b> (three identical cards). Then you see the maal. Before that, you can’t use jokers or score maal points.</p>
 <h4>Maal cards (all are jokers once you’ve seen)</h4><ul><li><b>Tiplu</b>: the same card as the maal, 3 points.</li><li><b>Poplu</b>: one rank higher, same suit, 2 points. <b>Jhiplu</b>: one rank lower, same suit, 2 points.</li><li><b>Alter</b>: same rank, same color, other suit, 5 points.</li><li>Same rank in the other color: ordinary joker, 0 points.</li><li>Jhiplu + Tiplu + Poplu together is a <b>Marriage</b>: 10 points instead of 7. Each tunnela you showed is worth 5.</li></ul>
 <h4>Finishing</h4><p>After seeing the maal, finish (“game”) when your remaining cards, after your throw, all form groups of three: sequences, trials (three of a rank in different suits) or tunnelas. Jokers may fill gaps.</p>
 <h4>Settlement</h4><ul><li>Add up everyone’s maal points (T). Each player scores (players × own maal) − T.</li><li>The winner also collects 3 from each player who saw the maal and 10 from each who didn’t.</li><li><b>Murder</b>: players who never saw the maal count 0 maal. <b>Kidnap</b>: their maal goes to the winner.</li></ul>
 <h4>Dublees</h4><ul><li>A dublee is two identical cards (same rank and suit). Instead of three sequences, you can show <b>seven dublees</b> to see the maal.</li><li>A dublee player goes out by holding an <b>eighth dublee</b> after drawing; the other cards don’t matter. Each opponent then pays 5 extra.</li><li>Jokers can’t stand in for a dublee card. After seeing, a dublee player may only take the discard if it makes the eighth dublee.</li></ul>
 <p>Once you have seen the maal by sequences, you can’t pick up a discarded joker. The highest total after the last deal wins.</p>`;

async function startGame(key,opts){

  placements(){const L=[],v=this.v;if(!v)return L;

    v.players.forEach((p,s)=>{const l=this.li(s),sp=seatPt(l,this.n),a=seatAng(l,this.n);const q=l===0?{x:cx+CW*2.1,y:cy+ry*.62}:lerp({x:sp.x-Math.sin(a)*CW*1.1,y:sp.y+Math.cos(a)*CW*1.1},{x:cx,y:cy},.12);
      p.won.forEach((id,k)=>L.push({c:CARD_BY_ID[id],x:q.x+Math.floor(k/4)*.8,y:q.y-Math.floor(k/4)*1.4,r:jit(id,30)+(k%4)*4,t:26,up:false,s:.42,z:100+k}))});
    return L}

}

const GUIDES={
  callbreak:['Everyone gets 13 cards. First, bid how many tricks you will win.','Follow the suit that was led, and beat the best card if you can.','Spades are trump. With none of the led suit, you must play a spade.','Make your bid to score it. Miss it and you lose it.'],

  teenpatti:['Everyone puts in the boot and gets 3 cards face down.','Play blind for half price, or see your cards and bet double (Chaal).','Best hands: Trail › Pure sequence › Sequence › Color › Pair › High card.','With two players left you can ask for a Show. Pack to fold.'],
  flash:['Everyone puts in the boot and gets 3 cards face down.','Play blind for half price, or see your cards and bet double (Chaal).','Best hands: Trial › Double run › Run › Color › Jute › Top.','With two players left you can ask for a Show. Pack to fold.'],
  kitti:['You get 9 cards. Split them into three hands of three.','Your best split is set for you. Tap two cards to swap them.','Hands are compared one by one: 1st, then 2nd, then 3rd.','Win two shows to take the pot. If nobody does, it’s Kitti: the pot carries over.'],
  marriage:['Everyone gets 21 cards. Each turn, draw a card and then throw one.','Make three pure sequences or tunnelas, then tap Show to see the maal.','After seeing, maal cards are jokers and score points: tiplu, poplu, jhiplu, alter.','Finish when every card is in a group, or collect seven dublees instead.'],
  rummy:['Each player gets 13 cards. A cut card makes every card of its rank a joker.','Draw from the closed deck or the open pile, then discard one card.','Build sequences and sets. You need at least one pure sequence.','When all 13 cards are grouped, discard your last card and Declare.'],
  dhumbal:['You get 5 cards. You want the lowest total: A = 1, K = 13.','Discard one card, a set of one rank, or a run of 3 or more in one suit.','Then pick up from the deck or from the last discard.','When your total is low enough, call Show. You must be the lowest!']};

function withHard(f){const d=S.diff;S.diff='hard';try{return f()}finally{S.diff=d}}
CallBreak.prototype.hint=function(){if(this.cur!==0)return null;if(this.phase==='bid')return{text:`Suggested bid: ${this.estimate(this.players[0].hand)}`};
  if(!this.legalSet)return null;const c=withHard(()=>this.ai(0));return{ids:[c.id],text:`Try ${ctxt(c)}`}};
Kachuful.prototype.hint=function(){if(this.cur!==0)return null;if(this.phase==='bid')return{text:`Suggested call: ${this.estimate(this.players[0].hand).bid}`};
  if(!this.legalSet)return null;const c=withHard(()=>this.ai(0));const need=this.players[0].bid-this.players[0].tricks;return{ids:[c.id],text:need>0?`Try ${ctxt(c)} to win a trick`:`Try ${ctxt(c)} to avoid winning`}};
TeenPatti.prototype.hint=function(){const me=this.players[0];if(this.cur!==0||me.packed)return null;
  if(!me.seen)return{text:'Playing blind costs half. See your cards when the stake gets high.'};
  const s=this.strength(me),n=this.handName(me);
  return{text:s>.85?`${n}: very strong. Raise.`:s>.62?`${n}: good hand. Chaal.`:s>.38?`${n}: average. Chaal carefully, pack if the stake is high.`:`${n}: weak. Consider packing.`}};
Kitti.prototype.hint=function(){if(this.phase!=='arrange')return null;return{text:'Auto arrange finds a strong split. You need to win two of the three shows.'}};
Dhumbal.prototype.hint=function(){if(this.cur!==0)return null;const p=this.players[0],t=this.total(p.hand);
  if(this.phase==='discard'){let best=null;for(const g of this.groups(p.hand)){const R=p.hand.filter(c=>!g.includes(c));const sd=this.total(R)+6.5-.55*this.bestGroup(R);if(!best||sd<best.s)best={g,s:sd}}
    if(t<=this.limit&&withHard(()=>this.botShow(0)))return{text:`Your total is ${t}. Call Show!`};
    return{ids:best.g.map(c=>c.id),text:best.g.length>1?`Discard these ${best.g.length} cards together`:`Discard ${ctxt(best.g[0])}`}}
  if(this.phase==='pick'){let pick=null,bs=1e9;for(const c of this.prev){const H2=p.hand.concat([c]);const s=this.total(H2)-.55*this.bestGroup(H2);if(s<bs){bs=s;pick=c}}
    const deckS=this.total(p.hand)+6.5-.55*this.bestGroup(p.hand);
    if(pick&&bs<deckS)return{ids:[pick.id],text:`Take ${ctxt(pick)}`};const top=this.pile[this.pile.length-1];return{ids:top?[top.id]:[],text:'Draw from the deck'}}
  return null};
Rummy.prototype.hint=function(){if(this.cur!==0)return null;const p=this.players[0];
  if(this.phase==='draw'){const top=this.open[this.open.length-1],base=this.arr(p.hand).score;
    if(top&&(top.r===this.wildR||this.bestDiscard(p.hand.concat([top]),top.id).score<base-1))return{ids:[top.id],text:`Take ${ctxt(top)} from the open pile`};
    const d=this.pile[this.pile.length-1];return{ids:d?[d.id]:[],text:'Draw from the closed deck'}}
  if(this.phase==='discard'){const b=this.bestDiscard(p.hand,this.taken);return{ids:[b.card.id],text:b.score===0?`Discard ${ctxt(b.card)} and Declare!`:`Discard ${ctxt(b.card)}`}}
  return null};
Marriage.prototype.hint=function(){if(this.cur!==0)return null;const p=this.players[0];
  if(this.phase==='draw'){const top=this.disc[this.disc.length-1];
    if(top&&this.canPick(p,top)&&this.bestDiscard(p,p.hand.concat([top]),top.id).v>this.bestDiscard(p,p.hand,null).v+.5)return{ids:[top.id],text:`Take ${ctxt(top)}`};
    const d=this.pile[this.pile.length-1];return{ids:d?[d.id]:[],text:'Draw from the deck'}}
  if(this.phase==='discard'){if(!p.seen&&(this.pure(p.hand)||{k:0}).k>=3)return{text:'Tap Show to see the maal'};
    if(!p.seen&&this.dubs(p.hand)>=7)return{text:'Tap Show dublees to see the maal'};
    const f=this.finishCard(p);if(f)return{ids:[f.id],text:`Throw ${ctxt(f)} and Finish!`};
    const b=this.bestDiscard(p,p.hand,this.taken);return b?{ids:[b.c.id],text:`Throw ${ctxt(b.c)}`}:null}
  return null};
function showHint(){if(!G||!G.hint||G.remote){msg('Hints are not available here');return}let h=null;try{h=G.hint()}catch(e){console.error(e)}
  if(!h){msg('Hints appear when it’s your turn');return}HINT.clear();(h.ids||[]).forEach(id=>HINT.add(id));PF.hints=(PF.hints||0)+1;savePF();sfx('tick');render();msg(h.text)}
$('#bHint').onclick=()=>{ac();showHint()};
