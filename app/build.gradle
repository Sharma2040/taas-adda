plugins {
    id 'com.android.application'
}

android {
    namespace 'com.taasadda.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.taasadda.app'
        minSdk 24
        targetSdk 36
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer)
        versionName '0.4.0'
    }

    // Release signing comes from GitHub secrets (see PUBLISHING.md). Never commit the keystore.
    def ksFile = System.getenv('TAAS_KEYSTORE_FILE')
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('TAAS_KEYSTORE_PASSWORD')
                keyAlias 'upload'
                keyPassword System.getenv('TAAS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-nearby:19.3.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
