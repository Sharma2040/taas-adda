name: Build Taas Adda APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk TaasAdda.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TaasAdda-apk
          path: TaasAdda.apk

      - name: Publish as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Taas Adda build ${{ github.run_number }}
          body: |
            Download **TaasAdda.apk** below and open it on your Android phone.
            Built from commit ${{ github.sha }}.
          files: TaasAdda.apk
          make_latest: true
